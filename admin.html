<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 升级记录管理</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --surface: #2a2a2a;
      --surface-alt: #333;
      --border: #444;
      --text: #ddd;
      --text-muted: #999;
      --primary: #f39c12;
      --danger: #e74c3c;
      --success: #2ecc71;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .subtitle { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 24px; }

    /* Part selector */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--primary);
    }
    label {
      display: block;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      margin-top: 10px;
    }
    label:first-of-type { margin-top: 0; }
    select, input, textarea {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.8rem;
      font-family: inherit;
    }
    select:focus, input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
    textarea { resize: vertical; min-height: 60px; }
    .btn-row { display: flex; gap: 8px; margin-top: 12px; }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    .btn-primary { background: var(--primary); color: #000; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

    /* Existing records */
    .record-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .record {
      background: var(--surface-alt);
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .record-info { flex: 1; min-width: 0; }
    .record-race { font-weight: 600; color: var(--primary); font-size: 0.8rem; }
    .record-purpose { font-size: 0.75rem; margin-top: 2px; }
    .record-date { font-size: 0.65rem; color: var(--text-muted); margin-top: 2px; }
    .record-del {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0 4px;
      flex-shrink: 0;
    }
    .empty-hint { color: var(--text-muted); font-size: 0.75rem; font-style: italic; margin-top: 10px; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: #000;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 99;
    }
    .toast.show { opacity: 1; }
    .toast.error { background: var(--danger); color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 F1 部件升级记录</h1>
    <p class="subtitle">管理员页面 — 管理与提交各部件在赛季中的升级历史 | <a href="./" style="color:var(--primary);">返回3D查看器</a></p>

    <div class="section">
      <div class="section-title">选择部件</div>
      <select id="part-select">
        <option value="">-- 请选择部件 --</option>
      </select>
    </div>

    <div class="section" id="form-section" style="display:none;">
      <div class="section-title">➕ 添加升级记录</div>
      <label>赛事/站名</label>
      <input type="text" id="new-race" placeholder="例如：R3 澳大利亚大奖赛">
      <label>升级目的</label>
      <input type="text" id="new-purpose" placeholder="例如：提高下压力、减轻重量">
      <label>日期 (可选)</label>
      <input type="date" id="new-date">
      <div class="btn-row">
        <button class="btn-primary" id="btn-add">添加记录</button>
      </div>
    </div>

    <div class="section" id="records-section" style="display:none;">
      <div class="section-title">📋 现有记录</div>
      <div class="record-list" id="record-list"></div>
      <div class="empty-hint" id="empty-hint">暂无升级记录</div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const UPGRADES_KEY = 'f1-upgrade-data';
    const PARTS_KEY = 'f1-parts-catalog';

    // ── Part catalog (synced from main app CAR.objectNames) ──
    const DEFAULT_PARTS = [
      '前翼', '单体壳', '单体壳+底板', '挡风玻璃', '方向盘',
      '头枕', '安全带打开', '安全带关闭',
      '座舱', '后引擎盖', '尾灯', '尾翼', '尾翼支架', '排气管',
      '空气动力学套件', '后视镜框', '后视镜支架1', '后视镜支架2',
      '右后视镜', '左后视镜', '天线', '散热口支架',
      '右前轮', '左前轮', '右后轮', '左后轮',
      '右前悬挂', '左前悬挂', '右后悬挂', '左后悬挂',
      '右前刹车鼓', '左前刹车鼓', '右后刹车鼓', '左后刹车鼓',
    ];

    const partSelect = document.getElementById('part-select');
    const formSection = document.getElementById('form-section');
    const recordsSection = document.getElementById('records-section');
    const recordList = document.getElementById('record-list');
    const emptyHint = document.getElementById('empty-hint');
    const toast = document.getElementById('toast');

    // ── Data helpers ──
    function loadUpgrades() {
      try { return JSON.parse(localStorage.getItem(UPGRADES_KEY)) || {}; }
      catch { return {}; }
    }
    function saveUpgrades(data) {
      localStorage.setItem(UPGRADES_KEY, JSON.stringify(data));
    }
    function loadParts() {
      try { return JSON.parse(localStorage.getItem(PARTS_KEY)) || DEFAULT_PARTS; }
      catch { return DEFAULT_PARTS; }
    }
    function saveParts(parts) {
      localStorage.setItem(PARTS_KEY, JSON.stringify(parts));
    }

    // ── Init ──
    function initPartSelect() {
      const parts = loadParts();
      partSelect.innerHTML = '<option value="">-- 请选择部件 --</option>' +
        parts.map(p => `<option value="${p}">${p}</option>`).join('');
    }

    function getSelectedPart() {
      return partSelect.value || null;
    }

    function renderRecords() {
      const partName = getSelectedPart();
      if (!partName) {
        formSection.style.display = 'none';
        recordsSection.style.display = 'none';
        return;
      }

      formSection.style.display = '';
      recordsSection.style.display = '';

      const all = loadUpgrades();
      const upgrades = all[partName] || [];

      if (upgrades.length === 0) {
        recordList.innerHTML = '';
        emptyHint.style.display = '';
      } else {
        emptyHint.style.display = 'none';
        recordList.innerHTML = upgrades.map((u, i) => `
          <div class="record">
            <div class="record-info">
              <div class="record-race">${i + 1}. ${u.race}</div>
              <div class="record-purpose">目的：${u.purpose}</div>
              ${u.date ? `<div class="record-date">${u.date}</div>` : ''}
            </div>
            <button class="record-del" data-index="${i}" title="删除">✕</button>
          </div>
        `).join('');
      }
    }

    function showToast(msg, isError = false) {
      toast.textContent = msg;
      toast.className = 'toast' + (isError ? ' error' : '') + ' show';
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // ── Events ──
    partSelect.addEventListener('change', renderRecords);

    document.getElementById('btn-add').addEventListener('click', () => {
      const partName = getSelectedPart();
      const race = document.getElementById('new-race').value.trim();
      const purpose = document.getElementById('new-purpose').value.trim();
      const date = document.getElementById('new-date').value;

      if (!partName || !race || !purpose) {
        showToast('请填写赛事名称和升级目的', true);
        return;
      }

      const all = loadUpgrades();
      if (!all[partName]) all[partName] = [];
      all[partName].push({ race, purpose, date: date || null });
      saveUpgrades(all);

      // Clear form
      document.getElementById('new-race').value = '';
      document.getElementById('new-purpose').value = '';
      document.getElementById('new-date').value = '';

      renderRecords();
      showToast('✅ 升级记录已添加');
    });

    recordList.addEventListener('click', (e) => {
      if (!e.target.classList.contains('record-del')) return;
      const idx = parseInt(e.target.dataset.index);
      const partName = getSelectedPart();
      if (!partName) return;

      const all = loadUpgrades();
      all[partName].splice(idx, 1);
      if (all[partName].length === 0) delete all[partName];
      saveUpgrades(all);
      renderRecords();
      showToast('已删除');
    });

    // Init
    initPartSelect();
  </script>
</body>
</html>
