<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 爆炸视图 - Aston Martin AMR26</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='28' font-size='28'%3E%F0%9F%8F%8E%3C/text%3E%3C/svg%3E">
  <script>
    (function() {
      var state = JSON.parse(localStorage.getItem('f1-state') || '{}');
      if (state.theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <!-- Three.js Import Map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    /* ===== CSS Variables / Theming ===== */
    :root {
      --color-bg:           #1a1a1a;
      --color-surface:      #2a2a2a;
      --color-surface-alt:  #333333;
      --color-text:         #e8e8e8;
      --color-text-muted:   #999999;
      --color-primary:      #e10600;
      --color-primary-hover:#ff1a14;
      --color-accent:       #3498db;
      --color-accent-hover: #5dade2;
      --color-border:       #404040;
      --color-shadow:       rgba(0,0,0,0.5);
      --color-glass:        rgba(30,30,30,0.92);
      --radius:             12px;
      --radius-sm:          8px;
      --font-mono:          'Consolas', 'Courier New', monospace;
      --font-sans:          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      --transition-theme:   background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;

      /* F1 Category Colors */
      --cat-powerunit:      #e74c3c;
      --cat-chassis:        #f39c12;
      --cat-aero:           #3498db;
      --cat-suspension:     #2ecc71;
      --cat-elec:           #9b59b6;
      --cat-cooling:        #1abc9c;
      --cat-cockpit:        #e67e22;
      --cat-wheels:         #95a5a6;
    }

    [data-theme="light"] {
      --color-bg:           #f0f2f5;
      --color-surface:      #ffffff;
      --color-surface-alt:  #f8f9fa;
      --color-text:         #212529;
      --color-text-muted:   #6c757d;
      --color-primary:      #e10600;
      --color-primary-hover:#c70500;
      --color-accent:       #2980b9;
      --color-accent-hover: #1a6a9a;
      --color-border:       #dee2e6;
      --color-shadow:       rgba(0,0,0,0.1);
      --color-glass:        rgba(255,255,255,0.92);
    }

    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
      height: 100vh;
      overflow: hidden;
      transition: var(--transition-theme);
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== Main Layout ===== */
    #app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      grid-template-columns: 260px 1fr 320px;
      grid-template-areas:
        "header  header header"
        "sidebar canvas info"
        "bottombar bottombar bottombar";
      height: 100vh;
    }

    /* ===== Header ===== */
    #header {
      grid-area: header;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 1rem;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      z-index: 10;
    }

    #header .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    #header .logo .f1-badge {
      background: var(--color-primary);
      color: #fff;
      font-weight: 900;
      font-style: italic;
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      font-size: 0.9rem;
      letter-spacing: -0.02em;
    }

    #header .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .icon-btn {
      background: var(--color-surface-alt);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-theme), transform 0.15s;
    }

    .icon-btn:hover {
      background: var(--color-border);
      transform: scale(1.05);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    /* ===== 3D Canvas Container ===== */
    #canvas-container {
      grid-area: canvas;
      position: relative;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    #canvas-container canvas {
      display: block;
    }

    /* ===== Loading Overlay ===== */
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 50;
      transition: opacity 0.5s, visibility 0.5s;
    }

    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #loading-overlay .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading-overlay .progress-bar {
      width: 260px;
      height: 4px;
      background: var(--color-border);
      border-radius: 2px;
      overflow: hidden;
    }

    #loading-overlay .progress-fill {
      height: 100%;
      background: var(--color-primary);
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s;
    }

    #loading-overlay .loading-text {
      font-size: 0.85rem;
      color: var(--color-text-muted);
    }

    /* ===== Sidebar - Category Filters ===== */
    #sidebar {
      grid-area: sidebar;
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      overflow-y: auto;
      z-index: 5;
    }

    #sidebar .section-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-text-muted);
      margin-bottom: 0.25rem;
      margin-top: 0.5rem;
    }

    #sidebar .section-title:first-child {
      margin-top: 0;
    }

    #sidebar .part-count {
      font-size: 0.7rem;
      color: var(--color-text-muted);
      margin-left: auto;
    }

    .cat-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.75rem;
      border: 2px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--color-text);
      cursor: pointer;
      font-size: 0.85rem;
      font-family: var(--font-sans);
      transition: var(--transition-theme), transform 0.12s, border-color 0.2s;
      text-align: left;
      width: 100%;
    }

    .cat-btn:hover {
      border-color: var(--color-text-muted);
    }

    .cat-btn:active {
      transform: scale(0.97);
    }

    .cat-btn .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .cat-btn.active {
      border-color: var(--cat-color, var(--color-accent));
      background: color-mix(in srgb, var(--cat-color, var(--color-accent)) 10%, transparent);
    }

    /* ===== Info Panel ===== */
    #info-panel {
      grid-area: info;
      background: var(--color-surface);
      border-left: 1px solid var(--color-border);
      padding: 1rem;
      overflow-y: auto;
      z-index: 5;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    #info-panel.hidden {
      opacity: 0.4;
    }

    #info-panel .panel-placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      text-align: center;
      gap: 0.5rem;
      font-size: 0.9rem;
    }

    #info-panel .panel-placeholder .icon {
      font-size: 3rem;
      opacity: 0.3;
    }

    #info-panel .panel-content {
      display: none;
      flex-direction: column;
      gap: 0.75rem;
    }

    #info-panel.has-selection .panel-placeholder {
      display: none;
    }

    #info-panel.has-selection .panel-content {
      display: flex;
    }

    #info-panel .part-name {
      font-size: 1.15rem;
      font-weight: 700;
    }

    #info-panel .part-category {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
      background: var(--cat-color);
      align-self: flex-start;
    }

    #info-panel .part-function {
      font-size: 0.88rem;
      line-height: 1.5;
      color: var(--color-text);
    }

    #info-panel .part-specs {
      list-style: none;
      padding: 0;
    }

    #info-panel .part-specs li {
      font-size: 0.82rem;
      padding: 0.35rem 0;
      border-bottom: 1px solid var(--color-border);
      color: var(--color-text-muted);
    }

    #info-panel .part-specs li:last-child {
      border-bottom: none;
    }

    #info-panel .part-specs li::before {
      content: '▸ ';
      color: var(--color-primary);
    }

    /* ===== Bottom Bar - Explosion Slider ===== */
    #bottombar {
      grid-area: bottombar;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      padding: 0.6rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      z-index: 10;
    }

    #bottombar .slider-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-text-muted);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #explosion-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      background: var(--color-border);
      outline: none;
      cursor: pointer;
    }

    #explosion-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--color-primary);
      border: 3px solid var(--color-surface);
      cursor: pointer;
      box-shadow: 0 2px 6px var(--color-shadow);
      transition: transform 0.1s;
    }

    #explosion-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    #bottombar .slider-value {
      font-size: 0.9rem;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--color-primary);
      min-width: 3rem;
      text-align: right;
    }

    #bottombar .hint {
      font-size: 0.72rem;
      color: var(--color-text-muted);
      white-space: nowrap;
      margin-left: auto;
    }

    /* ===== Toast ===== */
    #toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-size: 0.85rem;
      box-shadow: 0 4px 16px var(--color-shadow);
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 100;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== Responsive - Tablet ===== */
    @media (max-width: 1200px) {
      #app {
        grid-template-columns: 220px 1fr 280px;
      }
    }

    /* ===== Responsive - Mobile ===== */
    @media (max-width: 860px) {
      #app {
        grid-template-rows: auto 1fr auto auto;
        grid-template-columns: 1fr;
        grid-template-areas:
          "header"
          "canvas"
          "categories"
          "bottombar";
      }

      #sidebar {
        grid-area: categories;
        border-right: none;
        border-top: 1px solid var(--color-border);
        flex-direction: row;
        flex-wrap: wrap;
        gap: 0.35rem;
        padding: 0.5rem;
        overflow-y: visible;
      }

      #sidebar .section-title {
        display: none;
      }

      .cat-btn {
        font-size: 0.72rem;
        padding: 0.35rem 0.55rem;
        gap: 0.3rem;
        white-space: nowrap;
      }

      .cat-btn .dot {
        width: 8px;
        height: 8px;
      }

      #info-panel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        max-height: 40vh;
        border-left: none;
        border-top: 1px solid var(--color-border);
        border-radius: 16px 16px 0 0;
        transform: translateY(100%);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 -4px 20px var(--color-shadow);
        z-index: 20;
      }

      #info-panel.sheet-open {
        transform: translateY(0);
      }

      #bottombar {
        padding: 0.5rem 1rem;
        gap: 0.6rem;
      }

      #bottombar .hint {
        display: none;
      }
    }

    @media (max-width: 480px) {
      #header .logo span:last-child {
        display: none;
      }

      #bottombar .slider-label {
        font-size: 0.7rem;
      }

      .cat-btn {
        font-size: 0.68rem;
        padding: 0.3rem 0.45rem;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <div class="logo">
        <span class="f1-badge">F1</span>
        <span>EXPLODED VIEW · AMR26</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-theme" title="切换主题">🌓</button>
        <button class="icon-btn" id="btn-reset" title="重置视角">🔄</button>
        <button class="icon-btn" id="btn-help" title="帮助">?</button>
      </div>
    </header>

    <!-- 3D Canvas -->
    <div id="canvas-container">
      <!-- Loading Overlay -->
      <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="loading-text" id="loading-text">加载 3D 模型中...</div>
      </div>
    </div>

    <!-- Sidebar - Category Filters -->
    <aside id="sidebar">
      <div class="section-title">系统分类</div>
    </aside>

    <!-- Info Panel -->
    <aside id="info-panel" class="hidden">
      <div class="panel-placeholder">
        <div class="icon">🏎️</div>
        <div>点击赛车部件<br>查看详细技术信息</div>
      </div>
      <div class="panel-content">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div class="part-category" id="info-category"></div>
          <button class="icon-btn" id="btn-close-info" title="关闭" style="flex-shrink:0;">✕</button>
        </div>
        <div class="part-name" id="info-name"></div>
        <p class="part-function" id="info-function"></p>
        <ul class="part-specs" id="info-specs"></ul>
      </div>
    </aside>

    <!-- Bottom Bar -->
    <div id="bottombar">
      <span class="slider-label">💥 爆炸程度</span>
      <input type="range" id="explosion-slider" min="0" max="100" value="0" step="1">
      <span class="slider-value" id="slider-value">0%</span>
      <span class="hint">🖱 拖拽=旋转 | 滚轮=缩放 | 右键=平移 | R=重置</span>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ===== Constants =====
    const CATEGORIES = [
      { id: 'chassis',    label: 'Chassis',        labelZh: '底盘/车身',   color: '#f39c12', shortcut: '1' },
      { id: 'powerunit',  label: 'Power Unit',     labelZh: '动力单元',     color: '#e74c3c', shortcut: '2' },
      { id: 'aero',       label: 'Aerodynamics',   labelZh: '空气动力学',   color: '#3498db', shortcut: '3' },
      { id: 'cockpit',    label: 'Cockpit',        labelZh: '座舱',         color: '#e67e22', shortcut: '4' },
      { id: 'wheels',     label: 'Wheels & Tyres', labelZh: '车轮轮胎',     color: '#95a5a6', shortcut: '5' },
      { id: 'elec',       label: 'Electronics',    labelZh: '电子/灯光',    color: '#9b59b6', shortcut: '6' },
      { id: 'suspension', label: 'Suspension',     labelZh: '悬挂/刹车',    color: '#2ecc71', shortcut: '7' },
      { id: 'cooling',    label: 'Cooling',        labelZh: '冷却系统',     color: '#1abc9c', shortcut: '8' },
    ];

    // ===== 🏎️ 车辆配置 =====
    const CAR = {
      name: 'Aston Martin AMR26',
      modelPath: 'model/scene.gltf',
      cameraPos: [3.5, 2.0, 5.5],
      cameraTarget: [0, 0.2, 0.5],
    };

    // ===== Object_# → 真实F1部件名称与描述 =====
    CAR.objectNames = {
      // ── 后视镜 ──
      'Object_0':  { zh: '右后视镜外壳',   cat: 'aero', desc: '碳纤维复合材料制成的流线型外壳，将空气阻力降至最低的同时保护内部镜片。后视镜在F1中不仅是视野工具，更是经过精密空气动力学优化的关键部件。' },
      'Object_42': { zh: '左后视镜总成',   cat: 'aero', desc: '包含外壳、镜片和安装支架的完整后视镜总成。F1后视镜位置经过风洞验证，可产生有益的前方气流扰动，对前翼和侧箱气流有显著影响。' },
      'Object_48': { zh: '后视镜支架',     cat: 'aero', desc: '将后视镜固定于单体壳侧面的碳纤维支架。支架的截面形状经过空气动力学优化，兼具导流作用，可引导气流绕过头盔侧面。' },
      'Object_67': { zh: '后视镜镜片',     cat: 'aero', desc: '凸面防眩光镜片，为车手提供宽广的后方视野。镜片角度可通过电动调节，帮助车手在直道上观察后方对手并防守超车。' },
      'Object_165':{ zh: '右后视镜总成',   cat: 'aero', desc: '右侧后视镜完整总成，与左侧对称设计。两侧后视镜总成在空气动力学上经过不对称调校以适应赛道不同弯道方向的视野需求。' },

      // ── 左前悬挂/刹车 ──
      'Object_1':  { zh: '左前碳纤维刹车碟', cat: 'wheels', desc: '碳-碳复合材料制动碟盘，工作温度可达400-1000°C。F1刹车碟直径278mm、厚度32mm，表面有高达1400个通风孔用于散热，在5秒内可将赛车从300km/h减速至80km/h。' },
      'Object_2':  { zh: '左前刹车碟内盘', cat: 'wheels', desc: '刹车碟的内侧摩擦面。刹车碟为通风式结构，内外盘之间有气道，利用离心力将高温空气从中心向外排出，确保极端制动工况下的热稳定性。' },
      'Object_3':  { zh: '左前刹车卡钳',   cat: 'wheels', desc: '6活塞单体式液压卡钳，由铝合金精密加工而成。卡钳活塞以极高的液压压力将刹车片压向刹车碟，每个车轮的制动力由线控制动系统（BBW）独立精确控制。' },
      'Object_4':  { zh: '左前卡钳安装支架', cat: 'wheels', desc: '将刹车卡钳刚性固定在转向节上的碳纤维支架。需承受超过5G的制动力矩，同时兼具导风罩功能，将冷却气流导向刹车碟。' },
      'Object_5':  { zh: '左前轮毂',       cat: 'wheels', desc: '镁合金锻造轮毂，连接车轮轴承与轮辋。F1轮毂集成了轮胎气压和温度传感器、制动温度传感器，并通过空心轴传递动力和制动扭矩。' },
      'Object_6':  { zh: '左前转向横拉杆', cat: 'suspension', desc: '连接转向齿条与转向节的拉杆，将方向盘的旋转运动转化为车轮的转向角。拉杆长度可调，用于设定前束角（Toe），直接影响入弯响应速度。' },
      'Object_7':  { zh: '左前转向节',     cat: 'suspension', desc: '连接上下叉臂、推杆和转向拉杆的核心结构件。由高强度铝合金或钛合金制成，集合了轮毂轴承安装面、卡钳安装点和所有悬挂连接点。' },
      'Object_8':  { zh: '左前推杆',       cat: 'suspension', desc: '连接转向节与底盘摇臂（Rocker）的碳纤维推杆。推杆将车轮的垂直运动传递给车内安装的扭杆弹簧和减震器，使得非簧载质量最小化。' },
      'Object_9':  { zh: '左前防倾杆连杆', cat: 'suspension', desc: '连接悬挂摇臂与防倾杆的连接杆。防倾杆在车辆侧倾时产生扭转弹力，抵抗车身侧倾，调整前后防倾杆刚度配比可精细调控赛车过弯平衡。' },
      'Object_40': { zh: '左前下前叉臂',   cat: 'suspension', desc: '前悬挂下方的叉形连杆前支臂。由碳纤维复合材料制成，一端连接底盘、另一端连接转向节。F1采用双叉臂（Double Wishbone）悬挂布局，上下叉臂共同定义车轮运动轨迹。' },
      'Object_41': { zh: '左前下后叉臂',   cat: 'suspension', desc: '前悬挂下方的叉形连杆后支臂。与前支臂共同构成下叉臂组件，承受制动和加速时的纵向力。两臂角度差异形成抗俯仰几何（Anti-dive Geometry）。' },
      'Object_163':{ zh: '左前上叉臂',     cat: 'suspension', desc: '前悬挂上方叉臂，由碳纤维预浸布在高压釜中固化成型。上叉臂的安装角度定义了前轮外倾角变化曲线（Camber Curve），是决定轮胎接地特性的关键参数。' },
      'Object_164':{ zh: '左前上叉臂后支', cat: 'suspension', desc: '上叉臂的后部连接臂。所有叉臂连接点均采用球形轴承（Spherical Bearing），消除摩擦和弹性变形，确保悬挂运动的精确性和可重复性。' },

      // ── 右前悬挂/刹车 ──
      'Object_14': { zh: '右前上叉臂',     cat: 'suspension', desc: '与左侧对称的右前上叉臂结构。F1赛车左右悬挂设定通常存在不对称调校，以适应赛道弯道分布的不均等性。' },
      'Object_15': { zh: '右前上叉臂后支', cat: 'suspension', desc: '右前上叉臂的后部支撑臂。后支臂的长度和角度影响主销后倾角（Caster Angle），更大的后倾角提供更重的转向手感和更好的高速直线稳定性。' },
      'Object_17': { zh: '右前下前叉臂',   cat: 'suspension', desc: '右前下叉臂的前支臂。下叉臂承受赛车通过 bumps 和 curbs 时的大部分冲击载荷，是悬挂系统中受力最大的部件之一。' },
      'Object_18': { zh: '右前下后叉臂',   cat: 'suspension', desc: '右前下叉臂的后支臂。后支臂较前支臂更长，这种不对称设计在制动时产生前束增加（Toe-in）效应，提高制动稳定性。' },
      'Object_53': { zh: '右前推杆',       cat: 'suspension', desc: '碳纤维推杆，在F1的前推杆布局中承受压力。推杆将轮上运动传递至底盘内部的摇臂-扭杆-减震器总成，这种布置使空气动力学表面不受悬挂组件干扰。' },
      'Object_54': { zh: '右前防倾杆连杆', cat: 'suspension', desc: '右前防倾杆连接杆。防倾杆（Anti-roll Bar）通过扭转刚度抵抗车身侧倾，车手可在比赛中通过方向盘拨片分级调节前后防倾杆刚度，适应燃油消耗带来的重量变化。' },
      'Object_168':{ zh: '右前碳纤维刹车碟', cat: 'wheels', desc: '右前刹车碟。F1前轮承担约60%的制动力，前刹车碟比后轮更厚更大以应对更高的热负荷。每个刹车碟价值约€5000，使用寿命约800-1000km。' },
      'Object_169':{ zh: '右前刹车碟内盘', cat: 'wheels', desc: '刹车碟的内侧通风盘。碳-碳刹车在低温时性能急剧下降，暖胎圈中车手通过频繁轻刹将刹车温度提升至200°C以上的工作窗口。' },
      'Object_170':{ zh: '右前刹车卡钳',   cat: 'wheels', desc: '铝合金单体式6活塞卡钳。2026年规则引入线控制动（Brake-by-Wire）系统，后轮制动力由ECU根据动能回收状态动态分配，前轮仍保持液压制动为主。' },
      'Object_171':{ zh: '右前卡钳安装支架', cat: 'wheels', desc: '碳纤维卡钳支架。除固定卡钳外，支架还设计了专门的导风通道，将从刹车通风管引入的冷却空气精确导向刹车碟中心。' },
      'Object_172':{ zh: '右前轮毂',       cat: 'wheels', desc: '镁合金轮毂。F1 2026年使用18英寸轮辋，轮毂集成了TPMS胎压传感器和红外温度传感器阵列，实时监测轮胎工作状态。' },
      'Object_173':{ zh: '右前转向横拉杆', cat: 'suspension', desc: '转向横拉杆。F1转向系统为纯机械液压助力，拉杆端部采用航空级球轴承，消除间隙，确保车手对前轮抓地力极限的精确感知。' },
      'Object_174':{ zh: '右前转向节',     cat: 'suspension', desc: '高强度铝合金转向节。除机械连接功能外，转向节内部加工有复杂的冷却风道，将刹车碟辐射的热量通过轮辋排出。' },

      // ── 左后悬挂/刹车 ──
      'Object_43': { zh: '左后碳纤维刹车碟', cat: 'wheels', desc: '后轮刹车碟，直径较前轮略小。后轮制动由线控制动系统管理，ECU根据MGU-K的动能回收功率实时调节后轮液压制动比例，实现能量回收效率最大化。' },
      'Object_44': { zh: '左后刹车碟内盘', cat: 'wheels', desc: '后刹车碟内侧通风盘。后刹车工作温度通常比前刹车低100-200°C，因为后轮承担较少制动载荷，且部分制动能量被MGU-K吸收转化为电能。' },
      'Object_45': { zh: '左后卡钳与轮毂总成', cat: 'wheels', desc: '后刹车卡钳与轮毂的集成总成。后卡钳通常为4活塞设计。轮毂通过空心半轴与差速器连接，半轴内部穿过驱动轴，外部轴承支撑车轮旋转。' },

      // ── 右后悬挂/刹车 ──
      'Object_152':{ zh: '右后碳纤维刹车碟', cat: 'wheels', desc: '右后刹车碟。四轮碳-碳刹车系统在材料配方上前后不同，前碟偏重制动力峰值，后碟偏重线性可控性和热稳定性。' },
      'Object_153':{ zh: '右后刹车碟内盘', cat: 'wheels', desc: '右后刹车碟内盘。F1刹车系统的散热设计极其精密，每个刹车碟有专属的碳纤维导风管，将侧箱进气口收集的冷空气精确导向刹车中心。' },
      'Object_154':{ zh: '右后卡钳与轮毂总成', cat: 'wheels', desc: '右后卡钳与轮毂总成。后轮总成集成了线控制动的液压执行器，ECU每秒数百次调节后轮制动力分配，确保在动能回收状态下制动力矩平稳过渡。' },

      // ── 后悬挂组件 ──
      'Object_23': { zh: '后悬挂下叉臂前支', cat: 'suspension', desc: '后悬挂下方叉臂的前端连接臂。后悬挂采用多连杆布局（Multilink），通过多个独立连杆精确控制车轮的外倾角、前束角和纵向位置。' },
      'Object_24': { zh: '后悬挂下叉臂后支', cat: 'suspension', desc: '后悬挂下方叉臂的后端连接臂。后悬挂连杆的几何布置决定了后轮在加速和制动时的动态前束变化（Compliance Toe），对出弯牵引力有直接影响。' },
      'Object_25': { zh: '后悬挂上叉臂前支', cat: 'suspension', desc: '后悬挂上方叉臂的前端连接臂。上叉臂的角度控制后轮外倾角曲线，F1赛车后轮通常设定为较大负外倾角以最大化侧向抓地力。' },
      'Object_26': { zh: '后悬挂上叉臂后支', cat: 'suspension', desc: '后悬挂上方叉臂的后端连接臂。碳纤维叉臂每一层的纤维取向都经过有限元分析优化，以实现特定方向的刚度和强度需求。' },
      'Object_27': { zh: '后悬挂主拉杆（左）', cat: 'suspension', desc: '连接后轮摇臂与底盘的拉杆（Pull Rod），在F1的后拉杆布局中承受拉力。拉杆/推杆的选择影响悬挂运动学、重心高度和空气动力学空间利用率。' },
      'Object_28': { zh: '后悬挂束角连杆（左）', cat: 'suspension', desc: '控制后轮前束角（Toe）的专用连杆。通过调整连杆长度设定后轮前束，通常设定为前束正（Toe-in）以提高加速时的后轴稳定性。' },
      'Object_55': { zh: '后悬挂弹簧摇臂（左）', cat: 'suspension', desc: '将拉杆的线性运动转换为扭杆弹簧扭转运动的摇臂机构（Rocker/Bellcrank）。摇臂的几何轮廓决定悬挂的上升率（Motion Ratio），即车轮行程与弹簧压缩量的非线性关系。' },
      'Object_56': { zh: '后悬挂减震器（左）', cat: 'suspension', desc: '液压旋转式减震器。F1减震器通过精密的阀门系统控制压缩和回弹阻尼，低速和高速阻尼独立可调，车手可通过方向盘旋钮在比赛中实时切换阻尼模式。' },
      'Object_57': { zh: '后悬挂第三弹簧',   cat: 'suspension', desc: '连接两侧摇臂的横向弹簧元件（Heave Spring / Third Element）。第三弹簧只对车身起伏运动（Heave）产生作用，不影响侧倾刚度，允许工程师独立调校行驶高度控制和侧倾特性。' },
      'Object_58': { zh: '后悬挂防倾杆（左）', cat: 'suspension', desc: '后防倾杆通过扭转弹力抵抗车身侧倾。2026年规则允许更复杂的液压互联悬挂系统，防倾杆刚度可根据弯道类型和燃油载荷实时调节。' },
      'Object_59': { zh: '后悬挂主拉杆（右）', cat: 'suspension', desc: '右侧后悬挂拉杆，与左侧对称布局。两侧拉杆将车轮的垂直运动分别传递给独立的摇臂机构，左右悬挂运动通过防倾杆和第三弹簧实现耦合。' },
      'Object_60': { zh: '后悬挂束角连杆（右）', cat: 'suspension', desc: '右侧束角控制连杆。左右后轮前束角的微小差异可用于补偿轮胎在长弯道中的不均匀磨损，尤其在顺时针为主的赛道上左右设定往往不对称。' },

      // ── 轮胎 (4条，每条分为胎面和胎壁两个mesh) ──
      'Object_20': { zh: '右前轮胎侧壁',   cat: 'wheels', desc: 'Pirelli P Zero F1轮胎的侧壁（Sidewall）部分，标有轮胎配方颜色标识。侧壁的刚度和变形特性对轮胎接地印迹（Contact Patch）的形状和大小有关键影响。F1轮胎在5G横向加速度下仍能保持抓地力。' },
      'Object_21': { zh: '右前轮胎胎面',   cat: 'wheels', desc: 'Pirelli F1轮胎的胎面（Tread）部分，2026年起使用18英寸规格。胎面配方从C0（最硬）到C5（最软）共6种，每条赛道Pirelli指定3种配方供车队选择。胎面工作温度窗口约80-120°C。' },
      'Object_31': { zh: '左前轮胎侧壁',   cat: 'wheels', desc: '左前轮胎侧壁。在大多数顺时针赛道上，左前轮承受最大的载荷和磨损。轮胎侧壁在弯道中承受巨大侧向力时发生可控变形，维持最佳接地面积。' },
      'Object_32': { zh: '左前轮胎胎面',   cat: 'wheels', desc: '左前轮胎胎面。前轮胎面宽度约305mm（2026规格）。胎面花纹极浅（光头胎），在干燥条件下最大化与赛道表面的分子级接触面积，产生超过2吨的下压力抓地力。' },
      'Object_50': { zh: '右后轮胎侧壁',   cat: 'wheels', desc: '右后轮胎侧壁。后轮规格为18英寸，胎面比前轮更宽以承受加速牵引力和动力输出。后轮胎在出弯时需要承受超过1000hp的动力冲击。' },
      'Object_51': { zh: '右后轮胎胎面',   cat: 'wheels', desc: '右后轮胎胎面。后轮胎面宽度约405mm。F1轮胎从制造到赛道使用全程温控，轮胎加热毯将轮胎预热至约80-100°C（前轮）和80°C（后轮）以确保出站即进入工作窗口。' },
      'Object_64': { zh: '左后轮胎侧壁',   cat: 'wheels', desc: '左后轮胎侧壁。2026年Pirelli轮胎采用全新的结构和配方以匹配新一代赛车增大的扭矩输出和降低的下压力水平。' },
      'Object_65': { zh: '左后轮胎胎面',   cat: 'wheels', desc: '左后轮胎胎面。每套轮胎在前轮约承受400kg、后轮约480kg的静态载荷，在高速弯道中由于下压力作用，动态载荷可超过1吨。一套软胎的排位赛寿命仅约15-30km。' },

      // ── 轮辋 (4个) ──
      'Object_22': { zh: '右前轮辋',       cat: 'wheels', desc: '镁合金锻造18英寸轮辋。2026年F1引入标准轮辋罩（Wheel Cover），用于管理轮胎尾流并减少乱流对后车的影响。轮辋通过中心锁紧螺母（Wheel Nut）固定在轮毂上。' },
      'Object_33': { zh: '左前轮辋',       cat: 'wheels', desc: '镁合金前轮辋。F1轮辋重量仅约3-4kg，但可承受超过5吨的径向载荷。轮辋内侧装有气压和温度传感器，数据通过无线遥测实时传输至Pit Wall。' },
      'Object_52': { zh: '右后轮辋',       cat: 'wheels', desc: '镁合金后轮辋，宽度比前轮辋更宽以匹配405mm后轮胎面。轮辋的轮圈设计影响轮胎胎壁的空气动力学行为，2026年轮辋罩进一步优化了这一区域的气流。' },
      'Object_66': { zh: '左后轮辋',       cat: 'wheels', desc: '镁合金后轮辋。进站换胎时，气动扳手以超过2000Nm的扭矩松开中心锁紧螺母，仅需约2秒即可完成一个车轮的拆卸。轮辋上的定位销确保安装时角度精确对齐。' },

      // ── 座舱 / 单体壳 ──
      'Object_16': { zh: '座舱内衬',       cat: 'cockpit', desc: '座舱内部的碳纤维/芳纶复合材料内衬，为车手提供舒适的乘坐表面。内衬设计有通风通道，引导冷却空气在车手身体周围流动，在高达50°C的座舱环境中维持可承受的体温。' },
      'Object_19': { zh: '座舱开口边框',   cat: 'cockpit', desc: '座舱开口（Cockpit Opening）周围的加强边框。这是车手进出的开口，也是安全规则极为严格的区域——开口尺寸必须确保车手能够在5秒内完成紧急撤离。' },
      'Object_30': { zh: '座舱加强框架',   cat: 'cockpit', desc: '钛合金/高强度铝合金座舱加强框架结构。在单体壳内部形成环状保护结构，增强座舱开口周围的刚度，防止侧向撞击时座舱变形侵入车手空间。' },
      'Object_34': { zh: '单体壳座舱段外壳', cat: 'chassis', desc: '单体壳（Monocoque）的座舱段碳纤维外壳。单体壳是F1赛车的核心安全结构，由超过12层碳纤维预浸布在不同方向上精确铺设，在高压釜中高温固化成型，形成一只完整的"生存舱"。' },
      'Object_63': { zh: '座舱防火泡棉',   cat: 'cockpit', desc: 'Nomex®防火泡棉，填充在车手身体周围，兼具能量吸收和防火隔热功能。Nomex材料在800°C火焰中不熔化、不滴落，为车手在火灾事故中提供关键的额外逃生时间。' },
      'Object_149':{ zh: '单体壳主体结构', cat: 'chassis', desc: '碳纤维单体壳（Monocoque / Survival Cell）主体。这是F1赛车最核心的安全部件，由碳纤维和蜂窝铝芯材复合而成，可承受超过250kN的静态挤压载荷和超过50G的冲击加速度。单体壳通过了FIA严格的碰撞测试认证。' },
      'Object_150':{ zh: '车手头枕',       cat: 'cockpit', desc: '能量吸收头枕，包围在车手头部两侧。由Confor®泡沫或类似粘弹性材料制成，在冲击中吸收头部侧向加速度。头枕的形状设计为在碰撞中引导头盔进入Halo与单体壳之间的安全空间。' },
      'Object_162':{ zh: '单体壳内壁结构', cat: 'chassis', desc: '单体壳内部碳纤维结构层。内层整合了踏板安装座、方向盘转向柱安装点和座椅固定轨道。单体壳的制造公差控制在±0.1mm内，每个单体壳的生产周期超过400小时。' },

      // ── 安全带 ──
      'Object_156':{ zh: '肩部安全带（左）', cat: 'cockpit', desc: '六点式安全带的左肩带，由聚酯纤维织带制成，宽度76mm。肩带从车手肩部向下延伸至单体壳后部的固定点。F1安全带可承受超过2000kg的瞬时拉力载荷。' },
      'Object_157':{ zh: '肩部安全带（右）', cat: 'cockpit', desc: '六点式安全带的右肩带。肩带上装有角度调节扣，确保在碰撞中载荷以正确的角度分布在车手锁骨和肋骨上，避免软组织损伤。' },
      'Object_158':{ zh: '腰部安全带（左）', cat: 'cockpit', desc: '六点式安全带的左腰带。腰带将车手骨盆牢牢固定在座椅中，防止在正面碰撞中车手从安全带下方滑出（Submarining效应）。' },
      'Object_159':{ zh: '腰部安全带（右）', cat: 'cockpit', desc: '六点式安全带的右腰带。所有安全带通过快速释放机构（Quick Release）连接到同一个中心锁扣，车手单手即可在0.3秒内完全释放所有六条安全带。' },
      'Object_160':{ zh: '胯部安全带（左）', cat: 'cockpit', desc: '六点式安全带的左胯带，从大腿之间穿过连接至单体壳底部。胯带是防潜水（Anti-submarining）设计的关键，确保车手在正面碰撞中不会滑动到安全带下方。' },
      'Object_161':{ zh: '胯部安全带（右）', cat: 'cockpit', desc: '六点式安全带的右胯带。FIA规定F1安全带必须每两年更换一次，每次碰撞后强制报废，确保织带材料性能不受老化和疲劳影响。' },
      'Object_166':{ zh: '安全带肩带扣紧态', cat: 'cockpit', desc: '肩带在锁紧状态下的展示。肩带的张紧力经过精确设定，既保证安全又不过度压迫车手锁骨。在长时间比赛中，过紧的肩带会严重影响车手呼吸和耐力表现。' },
      'Object_167':{ zh: '安全带肩带开放态', cat: 'cockpit', desc: '肩带在释放状态下的展示。快速释放机构采用航空级铝合金加工，内置双重锁定机制防止意外释放。释放机构的操作力设计为单手可操作但不会因振动误触。' },

      // ── 挡风玻璃 / 光学面板 ──
      'Object_68': { zh: '前光学面板',     cat: 'cockpit', desc: '安装在车手前方、方向盘上方的透明聚碳酸酯光学面板。不是传统意义的"挡风玻璃"，主要用于偏转前方来流以减少头盔承受的风压（Buffeting），而非提供视野。面板表面有疏水涂层确保雨天视野。' },
      'Object_155':{ zh: '侧光学面板',     cat: 'cockpit', desc: '座舱开口两侧的透明导流面板。引导气流平滑经过座舱开口，减少气流吹入座舱造成的阻力。在高速下，座舱内的湍流空气会对车手头盔产生剧烈振动，影响视线和舒适度。' },

      // ── 方向盘总成 ──
      'Object_69': { zh: '方向盘蓝色信息灯', cat: 'elec', desc: '方向盘上方的蓝色LED指示灯。蓝色灯光通常用于指示特定系统状态——如DRS可用区间提醒、维修区限速器激活状态或ERS电池充足电提示。' },
      'Object_128':{ zh: '方向盘红色警报灯', cat: 'elec', desc: '方向盘上的红色LED警报灯组。当动力单元、ERS系统或液压系统出现故障时闪烁红色，是车手接收紧急信息的最快速通道。红灯亮起时车手必须立即根据故障严重程度采取相应措施。' },
      'Object_129':{ zh: '方向盘黄色警示灯', cat: 'elec', desc: '方向盘上的黄色LED警示灯。通常用于指示非紧急但需要关注的信息——如轮胎温度过高、刹车温度接近临界值或燃油余量不足。黄灯允许车手在圈内调整驾驶方式而非立即进站。' },
      'Object_130':{ zh: '方向盘LCD显示屏', cat: 'elec', desc: '集成在方向盘中央的4.3英寸全彩LCD显示屏。显示多达40页可切换信息，包括：圈速差、ERS电量、轮胎温度（四轮独立）、刹车平衡设定、差速器设定、引擎模式、故障代码和策略信息。' },
      'Object_131':{ zh: '方向盘主体框架', cat: 'elec', desc: '碳纤维复合材料方向盘主体框架。重量仅约1.3-1.6kg。方向盘是快拆式设计，通过花键轴与转向柱连接，车手进出座舱时必须取下方向盘。内部集成多达25个按钮、6个旋钮和3组拨片。' },
      'Object_132':{ zh: '方向盘前壳面板', cat: 'elec', desc: '方向盘前壳的面板组件。面板由碳纤维精密加工而成，容纳所有按钮、旋钮和显示屏的安装座。面板表面有防滑哑光处理，避免阳光在显示屏上产生眩光。' },
      'Object_133':{ zh: '方向盘后壳面板', cat: 'elec', desc: '方向盘后部的壳体面板。后壳内安装有换挡拨片的机械结构和电子控制PCB板。所有电路连接通过方向盘底部的军用规格多针连接器（Multi-pin Connector）与赛车主线束连接。' },
      'Object_134':{ zh: '方向盘侧面摇杆面板', cat: 'elec', desc: '方向盘侧面的操控面板区域。容纳多功能旋转开关（Rotary Switches），每个旋钮有10-16个位置，控制从差速器设定到刹车平衡的多种参数。' },
      'Object_135':{ zh: '方向盘拨片安装面板', cat: 'elec', desc: '方向盘握把后方的拨片安装面板。安装3组碳纤维拨片：左侧下方为离合器拨片（仅起步使用）、左右上方为换挡拨片（右侧升档/左侧降档）、中央可选DRS或超车模式拨片。' },
      'Object_136':{ zh: '方向盘握把覆盖面板', cat: 'elec', desc: '方向盘握把外侧的碳纤维覆盖面板。握把位置精确成型以匹配每位车手的手形，外部包裹高性能硅胶防滑材料，即使在佩戴手套和出汗时也能保持可靠握持。' },
      'Object_137':{ zh: '方向盘底部面板', cat: 'elec', desc: '方向盘下方的封闭面板。方向盘中央的快拆花键座（Quick Release Hub）穿过此面板与转向柱啮合，花键采用零间隙设计确保精确的转向传递。' },
      'Object_138':{ zh: '方向盘旋钮标牌A', cat: 'elec', desc: '方向盘上的功能旋钮标牌，标注旋钮各位置对应的功能（如ENT = 引擎模式、BR- = 刹车平衡后移）。标牌使用激光蚀刻工艺在铝合金薄片上制作，确保在剧烈振动和强光下始终可读。' },
      'Object_139':{ zh: '方向盘旋钮标牌B', cat: 'elec', desc: '第二组功能标牌。方向盘上的每个旋钮和按钮都根据车手个人偏好和人体工学进行了定制排布，车手可以盲操作所有控制而无需低头查看。' },
      'Object_140':{ zh: '方向盘按钮标牌A', cat: 'elec', desc: '方向盘按钮的功能标识牌。按钮标签通常为缩写：PIT = 维修区限速器、RAD = 无线电、DRS = 尾翼开启、OT = 超车模式（增加ERS输出）等。' },
      'Object_141':{ zh: '方向盘按钮标牌B', cat: 'elec', desc: '第二组按钮标牌。标牌颜色与功能类别对应：红色为紧急/关键功能、黄色为ERS/动力模式、蓝色为通讯/确认功能、白色为信息翻页/次要功能。这种颜色编码减少车手在极端压力下的操作失误。' },
      'Object_142':{ zh: '方向盘菜单导航标牌', cat: 'elec', desc: 'LCD显示屏菜单系统的导航按钮标牌。车手通过方向盘上的方向键和确认键浏览复杂的显示菜单，可以实时切换查看不同系统状态页面。' },
      'Object_143':{ zh: '方向盘主开关标牌', cat: 'elec', desc: '方向盘主功能开关的标识牌，包含引擎熄火开关（Engine Kill）和ERS紧急断电开关。这些安全关键开关必须易于快速触及且操作无误，通常设计为凹陷式按钮防止误触。' },
      'Object_144':{ zh: 'DRS激活状态指示灯', cat: 'elec', desc: 'DRS（Drag Reduction System，减阻系统）激活时的绿色状态灯。当车手按下DRS按钮且赛车处于DRS检测区1秒内跟随前车时，指示灯亮起确认尾翼上襟翼已开启。DRS开启时尾翼阻力减少约15-20%，可带来约10-15km/h的额外直道尾速。' },
      'Object_145':{ zh: 'DRS可用预亮指示灯', cat: 'elec', desc: 'DRS系统可用的黄色预警指示灯。当赛车进入DRS检测点且满足跟随距离要求（1秒以内）时，预亮灯亮起告知车手可以在DRS激活区使用该系统。车手必须在正确的位置才能激活DRS。' },
      'Object_146':{ zh: '方向盘预留按钮盖板', cat: 'elec', desc: '方向盘上未使用的按钮位置的空白盖板。F1方向盘设计预留了扩展接口，不同赛道可能根据需求添加额外功能。盖板确保未用电接口不受灰尘、湿气和电磁干扰的影响。' },

      // ── 换挡指示灯 (LED Shift Light Bar) ──

      // ── 灯光系统 ──
      'Object_35': { zh: '前部雨天灯',     cat: 'elec', desc: '安装在前翼端板或鼻锥前缘的高亮度LED雨天信号灯。根据FIA规则，在雨天条件下必须开启以增加赛车前部的可见度。灯光亮度经过精确校调，确保后方车手能清楚判断前车位置。' },
      'Object_36': { zh: '后部雨天灯/尾灯', cat: 'elec', desc: '安装在尾翼中央或扩散器上方的高亮度LED尾灯。在雨天条件下持续闪烁以警示后车。在ERS充电模式下（无制动灯），此灯也用于提示后车前车正在回收能量、可能减速。' },
      'Object_148':{ zh: '侧面雨天灯',     cat: 'elec', desc: '安装在侧箱或Halo上的辅助雨天信号灯。在极度恶劣天气如能见度极低的大雨中，多角度灯光系统确保赛车从任何方向都能被其他车手看到。FIA对雨天灯的位置、亮度和闪烁频率有严格的技术规定。' },

      // ── 车身面板 / 空气动力学 ──
      'Object_10': { zh: '前部底板',       cat: 'aero', desc: '底板（Floor）的前段部分，位于前轮轴线之前。底板前缘（Floor Leading Edge）的设计决定了进入车底气流的速度和质量——即使1mm的离地间隙变化都能显著影响地面效应（Ground Effect）的下压力产出。' },
      'Object_11': { zh: '尾翼DRS上襟翼', cat: 'aero', desc: '尾翼上方的活动襟翼，是DRS（Drag Reduction System）的核心部件。当DRS激活时，襟翼绕轴旋转打开至水平角度，尾翼迎角减小约50°，减少约15-20%的空气阻力。DRS在正赛中每圈仅可在指定检测区使用（需满足1秒跟车条件）。' },
      'Object_12': { zh: '前鼻锥上部面板', cat: 'chassis', desc: '前鼻锥（Nose Cone）上方的碳纤维覆盖面板。鼻锥是赛车最前方的结构件，兼具空气动力学功能和碰撞吸能作用——前碰撞测试要求鼻锥在撞击中可控溃缩以吸收能量。' },
      'Object_13': { zh: '前鼻锥下部面板', cat: 'chassis', desc: '前鼻锥下方的气动面板。引导气流进入车底的文氏管通道（Venturi Tunnel）入口。2026年规则强化了地面效应，前鼻锥下部的气流管理对整车下压力产出至关重要。' },
      'Object_29': { zh: '引擎盖铰接面板', cat: 'chassis', desc: '引擎盖（Engine Cover）与底盘之间的连接铰接结构。引擎盖是快速拆装设计，比赛期间机械师可在数秒内取下引擎盖以检查动力单元状态。' },
      'Object_37': { zh: '引擎盖主体',     cat: 'chassis', desc: '碳纤维引擎盖（Engine Cover），覆盖动力单元和后悬挂顶部。引擎盖的形状决定了流向尾翼的气流质量——引擎盖的"鲨鱼鳍"（Shark Fin）设计用于在侧风中保持尾翼气流的稳定性。' },
      'Object_38': { zh: '尾翼左侧端板',   cat: 'aero', desc: '尾翼左侧的垂直端板（Endplate）。端板阻止翼尖涡流的形成，减少诱导阻力。端板外侧印有车号，内侧经过复杂的三维曲面设计以优化尾翼内侧气流。2026年端板内置了后轮尾流管理导流片。' },
      'Object_39': { zh: '尾翼右侧端板',   cat: 'aero', desc: '尾翼右侧端板。与左侧对称。端板还集成了后轮制动灯的安装位置。尾翼端板的下端通常延伸到扩散器出口平面，形成封闭的"端板效应"以增强扩散器效率。' },
      'Object_46': { zh: '侧箱上盖板',     cat: 'chassis', desc: '侧箱（Sidepod）上方的碳纤维盖板。侧箱内部包含：散热器（中冷器、水冷器、油冷器）、ERS电池组、ECU控制单元和部分电子设备。侧箱上盖板在碰撞时可快速拆卸以进行维修操作。' },
      'Object_47': { zh: '赞助商涂装贴花层', cat: 'chassis', desc: '车身表面的赞助商标识贴花（Decal/Livery）层。F1赛车涂装使用高性能乙烯基贴膜而非传统喷漆，以减轻重量（整车贴花仅重约150-200g）并允许快速更换。每个赞助商标识的位置都经过精心设计以最大化电视转播曝光。' },
      'Object_49': { zh: '底盘中央加强结构', cat: 'chassis', desc: '单体壳后部与动力单元连接处的碳纤维加强结构。这个区域承受动力单元的全部扭矩反作用力和后悬挂载荷，是整个赛车机械载荷最大的结构节点之一。' },
      'Object_61': { zh: '后部扩散器底板', cat: 'aero', desc: '底板后段的扩散器过渡区域。气流在此处从车底向上方膨胀，根据伯努利原理产生低压区。2026年规则的地面效应底板设计在此处设有文氏管通道的扩张段。' },
      'Object_62': { zh: '扩散器垂直导流片', cat: 'aero', desc: '扩散器（Diffuser）内部的垂直导流片（Fence/Vane）。这些导流片将扩散器出口分割为多个通道，每个通道独立管理不同来源的气流——来自文氏管喉部的加速气流和来自侧箱下方的冷却废气在此精确汇合。' },
      'Object_147':{ zh: '前翼端板',       cat: 'aero', desc: '前翼（Front Wing）外端的垂直端板。前翼端板产生外洗气流（Outwash），将前轮产生的湍流空气导向赛车外侧，减少其对车身和底板的不利影响。端板的曲率和攻角经过数千小时CFD计算优化。' },
      'Object_151':{ zh: '侧箱前缘导流板', cat: 'aero', desc: '侧箱前缘的垂直导流板（Sidepod Inlet Guide Vane）。这个关键的气流管理装置决定了进入侧箱散热器进气口的气流质量——既要最大化冷却效率，又要最小化对下游气流的破坏。2026年侧箱采用了激进的"下洗"（Downwash）设计。' },
    };

    // 根据 mesh 名称解析中文名、分类和专业描述
    function resolveMeshName(name) {
      const entry = CAR.objectNames[name] || CAR.namedMeshInfo[name];
      if (entry) return { zh: entry.zh, category: entry.cat, desc: entry.desc || '' };
      if (/^Object_\d+$/.test(name)) return { zh: '未识别零件(' + name + ')', category: 'chassis', desc: '' };
      return null;
    }

      TIRE_SIDES:         { zh: '轮胎侧壁',       cat: 'wheels', desc: 'Pirelli P Zero F1轮胎的侧壁（Sidewall），标有Pirelli P Zero和轮胎配方标识。侧壁上不同颜色的条纹（白/黄/红/紫/绿/蓝）分别代表C0至C5不同硬度配方。侧壁刚度直接影响轮胎接地印迹的形状。' },
      TIRE_TREAD:         { zh: '轮胎胎面',       cat: 'wheels', desc: 'F1轮胎的胎面（Tread）部分，2026年规格为前305mm/后405mm宽度的18英寸轮胎。光头胎（Slick）设计，无花纹，在干地条件下最大化橡胶分子与赛道表面的接触面积。工作温度窗口80-120°C，低于此温度抓地力急剧下降。' },

      cockpit:            { zh: '座舱碳纤维壳体', cat: 'cockpit', desc: '座舱区域的碳纤维壳体部分。座舱是车手的工作空间，内部温度可高达50°C。碳纤维壳体上精密加工出座椅安装面、安全带固定点和方向盘转向柱安装座，所有尺寸根据车手体型定制。' },
      cockpit_black_s:    { zh: '座舱内衬面板',   cat: 'cockpit', desc: '座舱内部的黑色耐高温面板。由芳纶（Kevlar®）和碳纤维混编复合材料制成，在高温下不释放有毒气体。面板设计有冷却空气导流槽，引导气流在车手身体周围流动。' },
      cockpit_metal:      { zh: '座舱金属加强框', cat: 'cockpit', desc: '座舱开口周围的钛合金/高强度铝合金加强框架。在侧向碰撞时保护车手，同时承受Halo装置的载荷。此框架是单体壳中唯一的非碳纤维主要结构件。' },
      cockpit_foam:       { zh: '防火吸能泡棉',   cat: 'cockpit', desc: 'Nomex®防火泡棉，填充于车手与单体壳之间的空隙。具有双重功能：1）在碰撞中吸收冲击能量；2）在火灾中提供防火隔热屏障。Nomex材料在800°C火焰中不熔化、不燃烧。' },
      gp21_cinture:       { zh: '六点式安全带系统', cat: 'cockpit', desc: '完整的FIA认证六点式安全约束系统。包括两条肩带、两条腰带和两条胯带，全部汇聚到中央快速释放机构。由高强度聚酯纤维织带制成（宽76mm），可承受超过2000kg的瞬时拉力。车手单手操作即可在0.3秒内完全释放。' },
      glass:              { zh: '光学聚碳酸酯面板', cat: 'cockpit', desc: '车手前方的透明聚碳酸酯（Polycarbonate）光学面板。主要功能不是挡风而是偏转前方来流、减少头盔风压（Buffeting）。面板经过光学级抛光并涂覆疏水涂层，确保雨水迅速滑落不影响视线。' },

      rear_light:         { zh: 'LED尾灯总成',    cat: 'elec', desc: '赛车尾部的LED灯光总成，安装在尾翼或扩散器区域。作为雨天灯（持续闪烁）、ERS状态灯和安全车期间的强制信号灯。LED灯组采用超高亮度设计，在200km/h的相对速度下仍可被后方车手清晰辨识。' },
      'CLEARLED.002':     { zh: 'LED指示灯面板A', cat: 'elec', desc: '仪表板/座舱内的LED信号指示面板。用于向车手显示关键车辆状态——如维修区限速器激活、DRS可用、无线电来电等。LED位置设计在车手周边视野范围内，无需转移视线即可察觉状态变化。' },
      'CLEARLED_PRE.001': { zh: 'LED指示灯面板B', cat: 'elec', desc: '第二组LED信号指示面板。F1赛车的电子系统极其复杂，超过300个传感器持续监测全车状态。关键警报通过LED灯组以颜色和闪烁频率编码，形成直观的信息传递层级。' },
      gp21_LCD:           { zh: '方向盘LCD显示屏', cat: 'elec', desc: '4.3英寸全彩LCD多功能显示屏，嵌入方向盘中央。可显示超过40页可切换信息页面，包括：分段圈速差（Delta Time）、四轮独立实时温度、ERS电池电量（State of Charge）、刹车平衡（Brake Balance）、差速器设定图、引擎映射模式和来自策略工程师的编码信息。' },
      rtt_sw_qr:          { zh: '方向盘快拆机构', cat: 'elec', desc: '方向盘与转向柱之间的快速拆装机构（Quick Release Hub）。采用航空级铝合金精密加工的花键轴设计，零间隙确保精确转向传递。方向盘底部的军用规格多针电连接器在快拆机构啮合时自动完成全车电路连接。车手必须取下方向盘才能进出座舱。' },
      rtt_sw_buttons:     { zh: '方向盘控制按钮组', cat: 'elec', desc: '方向盘上的多功能控制按钮阵列。每个按钮采用触觉反馈设计，即使是佩戴防火手套也能清晰感知按压。按钮功能包括：维修区限速器、无线电通讯、DRS激活、饮料系统、引擎模式切换和ERS超车模式等。按钮布局根据每位车手的个人偏好定制。' },

      sw_plastic_black:   { zh: '方向盘外壳',     cat: 'elec', desc: '方向盘前后外壳的碳纤维复合材料壳体。重量仅约1.3-1.6kg（不含快拆机构）。壳体将所有电子元件、PCB板和导线束封装在内，同时提供EMI电磁屏蔽保护。方向盘外壳的强度和刚度确保在高达5G的操舵力下不发生形变。' },

    // ===== SceneManager =====
    class SceneManager {
      constructor(container) {
        this.container = container;
        this.renderer = null;
        this.scene = null;
        this.camera = null;
        this.controls = null;
      }

      init() {
        const w = this.container.clientWidth;
        const h = this.container.clientHeight;

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setSize(w, h);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.1;
        this.container.appendChild(this.renderer.domElement);

        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color('#1a1a1a');
        this.scene.fog = new THREE.Fog('#1a1a1a', 8, 30);

        this.camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
        this.camera.position.set(...CAR.cameraPos);
        this.camera.lookAt(...CAR.cameraTarget);

        // Lights
        const ambient = new THREE.AmbientLight('#8899bb', 0.7);
        this.scene.add(ambient);

        const hemi = new THREE.HemisphereLight('#b1c8e0', '#333333', 0.5);
        this.scene.add(hemi);

        const keyLight = new THREE.DirectionalLight('#ffffff', 3.0);
        keyLight.position.set(5, 8, 4);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.camera.near = 0.5;
        keyLight.shadow.camera.far = 50;
        keyLight.shadow.camera.left = -10;
        keyLight.shadow.camera.right = 10;
        keyLight.shadow.camera.top = 10;
        keyLight.shadow.camera.bottom = -10;
        keyLight.shadow.bias = -0.0001;
        this.scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight('#8899cc', 0.8);
        fillLight.position.set(-3, 2, -2);
        this.scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight('#ffffff', 1.2);
        rimLight.position.set(0, 1, -4);
        this.scene.add(rimLight);

        // Ground plane
        const groundGeo = new THREE.PlaneGeometry(20, 20);
        const groundMat = new THREE.MeshStandardMaterial({ color: '#222222', roughness: 0.7, metalness: 0.1 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1.5;
        ground.receiveShadow = true;
        this.scene.add(ground);

        // Grid
        const gridHelper = new THREE.PolarGridHelper(8, 48, 24, 64, '#444444', '#333333');
        gridHelper.position.y = -1.49;
        this.scene.add(gridHelper);

        // OrbitControls
        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.target.set(0, 0.2, 0.5);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.08;
        this.controls.minDistance = 1.5;
        this.controls.maxDistance = 12;
        this.controls.maxPolarAngle = Math.PI * 0.7;
        this.controls.minPolarAngle = 0.2;
        this.controls.update();

        this.defaultCameraPos = this.camera.position.clone();
        this.defaultTarget = new THREE.Vector3(...CAR.cameraTarget);

        this._cameraAnimTarget = null;
        this._cameraAnimStart = null;
        this._cameraAnimTime = 0;
        this._cameraAnimDuration = 0.8;
      }

      resize() {
        const w = this.container.clientWidth;
        const h = this.container.clientHeight;
        this.renderer.setSize(w, h);
        this.camera.aspect = w / h;
        this.camera.updateProjectionMatrix();
      }

      resetCamera(animate = true) {
        if (animate) {
          this._cameraAnimTarget = { pos: this.defaultCameraPos.clone(), target: this.defaultTarget.clone() };
          this._cameraAnimStart = {
            pos: this.camera.position.clone(),
            target: this.controls.target.clone(),
          };
          this._cameraAnimTime = 0;
          this._cameraAnimDuration = 0.8;
        } else {
          this.camera.position.copy(this.defaultCameraPos);
          this.controls.target.copy(this.defaultTarget);
          this.controls.update();
        }
      }

      updateCameraAnim(delta) {
        if (!this._cameraAnimTarget) return false;
        this._cameraAnimTime += delta;
        const t = Math.min(this._cameraAnimTime / this._cameraAnimDuration, 1.0);
        const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        this.camera.position.lerpVectors(this._cameraAnimStart.pos, this._cameraAnimTarget.pos, ease);
        this.controls.target.lerpVectors(this._cameraAnimStart.target, this._cameraAnimTarget.target, ease);
        if (t >= 1.0) {
          this._cameraAnimTarget = null;
          return false;
        }
        return true;
      }

      updateTheme(isDark) {
        const bgColor = isDark ? '#1a1a1a' : '#e8ecf0';
        const fogColor = isDark ? '#1a1a1a' : '#e8ecf0';
        this.scene.background = new THREE.Color(bgColor);
        this.scene.fog = new THREE.Fog(fogColor, 8, 30);
      }
    }

    // ===== Model Loader & Part Extractor =====
    class ModelPartExtractor {
      constructor(scene) {
        this.scene = scene;
        this.pivotGroup = new THREE.Group(); // root for all extracted pivots
        this.scene.add(this.pivotGroup);
        this.parts = []; // { id, meshName, category, pivot, center, direction, maxDist, assembledPos, explodedPos }
        this.modelCenter = new THREE.Vector3();
      }

      async loadAndExtract(gltfPath, onProgress) {
        const loader = new GLTFLoader();
        const gltf = await loader.loadAsync(gltfPath, (e) => {
          if (onProgress && e.total) onProgress(e.loaded / e.total);
        });
        const model = gltf.scene;

        // Update world matrices after loading
        model.updateWorldMatrix(true, true);

        // Compute global model bounding box
        const bbox = new THREE.Box3().expandByObject(model);
        bbox.getCenter(this.modelCenter);

        console.log('Model center:', this.modelCenter.toArray());
        console.log('Model size:', bbox.getSize(new THREE.Vector3()).toArray());

        // Collect all meshes with their FULL world transforms
        const meshes = [];

        model.traverse((child) => {
          if (child.isMesh && child.name) {
            const wp = new THREE.Vector3();
            const wq = new THREE.Quaternion();
            const ws = new THREE.Vector3();
            child.matrixWorld.decompose(wp, wq, ws);

            let zhName, category, desc;

            const info = resolveMeshName(child.name);
            if (info) {
              zhName = info.zh;
              category = info.category;
              desc = info.desc || '';
            } else {
              zhName = child.name.replace(/_/g, ' ');
              category = 'chassis';
              desc = '';
            }

            meshes.push({
              mesh: child,
              name: child.name,
              zhName: zhName,
              category: category,
              desc: desc,
              worldPos: wp.clone(),
              worldQuat: wq.clone(),
              worldScale: ws.clone(),
            });
          }
        });

        console.log(`Found ${meshes.length} named meshes`);

        // Group meshes by Chinese name (multiple meshes may share the same name)
        const groups = new Map(); // zhName → { meshes[], category }
        const catParts = {};      // category → count

        for (const m of meshes) {
          if (!groups.has(m.zhName)) {
            groups.set(m.zhName, { meshes: [], category: m.category });
            catParts[m.category] = (catParts[m.category] || 0) + 1;
          }
          groups.get(m.zhName).meshes.push(m);
        }

        const debugGroups = {};
        groups.forEach((g, name) => { debugGroups[name] = g.meshes.length; });
        console.log('Resolved groups:', JSON.stringify(debugGroups));
        console.log(`Grouped into ${groups.size} parts across ${Object.keys(catParts).length} categories`);

        // Debug: show first few parts' explosion data
        if (groups.size > 0) {
          const sample = [...groups.entries()].slice(0, 3);
          sample.forEach(([name, g]) => {
            const center = new THREE.Vector3(); g.meshes.forEach(m => center.add(m.worldPos)); center.divideScalar(g.meshes.length);
            console.log(`Part "${name}": center=(${center.x.toFixed(2)},${center.y.toFixed(2)},${center.z.toFixed(2)}) meshes=${g.meshes.length}`);
          });
          console.log('Model center:', this.modelCenter.toArray().map(v=>v.toFixed(2)));
        }

        // Create pivot groups for each mesh-name group
        let idx = 0;
        groups.forEach((group, zhName) => {
          if (group.meshes.length === 0) return;

          // Compute group center (average of all mesh world positions)
          const center = new THREE.Vector3();
          group.meshes.forEach(m => center.add(m.worldPos));
          center.divideScalar(group.meshes.length);

          // Create pivot group at the group center
          const pivot = new THREE.Group();
          pivot.position.copy(center);

          // Clone each mesh with correct world transform relative to pivot
          for (const m of group.meshes) {
            const clone = m.mesh.clone();

            // Set clone's local transform to match world transform
            clone.position.copy(m.worldPos).sub(center);
            clone.quaternion.copy(m.worldQuat);
            clone.scale.copy(m.worldScale);

            clone.castShadow = true;
            clone.receiveShadow = true;
            pivot.add(clone);
          }

          // Determine explosion direction
          // Strategy: parts explode radially from model center, but centerline parts
          // (near X=0) get boosted vertical separation instead of horizontal
          const relX = center.x - this.modelCenter.x;
          const relY = center.y - this.modelCenter.y;
          const relZ = center.z - this.modelCenter.z;
          const rawDist = Math.sqrt(relX * relX + relY * relY + relZ * relZ);

          const dir = new THREE.Vector3(relX, relY, relZ);

          if (rawDist < 0.03) {
            // Dead center: pure vertical, above → up, below → down
            dir.set(0, relY >= 0 ? 1 : -1, 0);
          } else {
            // Centerline bias: 1.0 at centerline, 0.0 at far edges
            const centerlineBias = Math.max(0, 1 - Math.abs(relX) / 0.6);
            // Suppress horizontal, amplify vertical for centerline parts
            const hScale = 1 - centerlineBias * 0.65;
            dir.x *= hScale;
            dir.z *= hScale;
            dir.y += centerlineBias * 2.5 * (relY >= 0 ? 1 : -1);
            dir.normalize();
          }

          const maxDist = Math.max(0.6, rawDist * 1.6 + 0.5);

          // Generate display name and description (use description from first mesh in group)
          const categoryZh = (CATEGORIES.find(c => c.id === group.category) || {}).labelZh || group.category;
          const descText = group.meshes[0]?.desc || `${categoryZh}组件 — ${zhName}。`;
          const func = descText || `${categoryZh}组件 — ${zhName}。${CAR.name} 精密赛车部件。`;
          const specs = [CAR.name, 'F1 2026赛季规格', `所属系统: ${categoryZh}`];

          const id = `part-${idx++}`;

          const entry = {
            id,
            meshName: zhName,
            category: group.category,
            zh: zhName,
            func: func,
            specs: specs,
            pivot,
            center: center.clone(),
            assembledPos: center.clone(),
            direction: dir,
            maxDist,
            explodedPos: center.clone().addScaledVector(dir, maxDist),
            currentFactor: 0,
            targetFactor: 0,
          };

          this.pivotGroup.add(pivot);
          this.parts.push(entry);
        });

        // Hide original model (we use cloned meshes in pivots)
        model.traverse(child => {
          if (child.isMesh) child.visible = false;
        });

        // Still add original to scene for any non-mesh objects (lights, etc.)
        this.scene.add(model);

        // Sort parts: center parts first, then by distance from center
        this.parts.sort((a, b) => {
          const da = a.center.distanceToSquared(this.modelCenter);
          const db = b.center.distanceToSquared(this.modelCenter);
          return da - db;
        });

        console.log(`Extracted ${this.parts.length} part groups`);

        return this.parts;
      }

      getCategoryParts() {
        const map = {};
        this.parts.forEach(p => {
          if (!map[p.category]) map[p.category] = [];
          map[p.category].push(p);
        });
        return map;
      }
    }

    // ===== ExplosionController =====
    class ExplosionController {
      constructor(parts) {
        this.parts = parts;
        this.globalFactor = 0;
        this.categoryOverrides = {};
        this.introPlaying = false;
        this.introTimer = 0;
        this.introDuration = 1.5;
      }

      startIntro() {
        this.introPlaying = true;
        this.introTimer = 0;
        this.globalFactor = 0.35;
        this._applyFactors();
      }

      setGlobalFactor(factor) {
        this.globalFactor = factor;
        this._applyFactors();
      }

      toggleCategory(categoryId) {
        if (this.categoryOverrides[categoryId]) {
          delete this.categoryOverrides[categoryId];
        } else {
          this.categoryOverrides[categoryId] = true;
        }
        this._applyFactors();
        return !!this.categoryOverrides[categoryId];
      }

      isCategoryActive(categoryId) {
        return !!this.categoryOverrides[categoryId];
      }

      assembleAll() {
        this.categoryOverrides = {};
        this.globalFactor = 0;
        this._applyFactors();
      }

      _applyFactors() {
        const hasOverride = Object.keys(this.categoryOverrides).length > 0;
        this.parts.forEach(p => {
          if (hasOverride) {
            p.targetFactor = this.categoryOverrides[p.category] ? this.globalFactor : 0;
          } else {
            p.targetFactor = this.globalFactor;
          }
        });
      }

      update(delta) {
        if (this.introPlaying) {
          this.introTimer += delta;
          if (this.introTimer >= this.introDuration) {
            this.introPlaying = false;
            this.globalFactor = 0;
            this._applyFactors();
          }
        }

        const lerpSpeed = 1 - Math.exp(-8 * delta);

        this.parts.forEach(p => {
          p.currentFactor += (p.targetFactor - p.currentFactor) * lerpSpeed;
          p.pivot.position.lerpVectors(p.assembledPos, p.explodedPos, p.currentFactor);
        });
      }

      getDisplayFactor() {
        if (this.parts.length === 0) return 0;
        let max = 0;
        for (const p of this.parts) {
          if (p.currentFactor > max) max = p.currentFactor;
        }
        return max;
      }
    }

    // ===== InteractionManager =====
    class InteractionManager {
      constructor(camera, domElement, parts) {
        this.camera = camera;
        this.domElement = domElement;
        this.parts = parts;
        this.raycaster = new THREE.Raycaster();
        this.mouse = new THREE.Vector2();
        this.hoveredPart = null;
        this.selectedPart = null;
        this.allMeshes = [];
        this.meshToPartMap = new Map();
        this.onHover = null;
        this.onSelect = null;
        this._lastHoverCheck = 0;
        this._hoverThrottle = 50;
        this._collectMeshes();
        this._bindEvents();
      }

      _collectMeshes() {
        this.allMeshes = [];
        this.meshToPartMap.clear();
        this.parts.forEach(part => {
          part.pivot.traverse(child => {
            if (child.isMesh) {
              this.allMeshes.push(child);
              this.meshToPartMap.set(child, part);
            }
          });
        });
      }

      _bindEvents() {
        this.domElement.addEventListener('mousemove', (e) => this._onMouseMove(e), { passive: true });
        this.domElement.addEventListener('click', (e) => this._onClick(e));
        this.domElement.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            this._touchStartTime = Date.now();
            this._touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          }
        }, { passive: true });
        this.domElement.addEventListener('touchend', (e) => {
          const dt = Date.now() - (this._touchStartTime || 0);
          const dx = Math.abs((e.changedTouches[0]?.clientX || 0) - (this._touchStartPos?.x || 0));
          const dy = Math.abs((e.changedTouches[0]?.clientY || 0) - (this._touchStartPos?.y || 0));
          if (dt < 300 && dx < 10 && dy < 10) {
            this._handleClick(e.changedTouches[0]);
          }
        });
      }

      _updateMouse(pos) {
        const rect = this.domElement.getBoundingClientRect();
        this.mouse.x = ((pos.clientX - rect.left) / rect.width) * 2 - 1;
        this.mouse.y = -((pos.clientY - rect.top) / rect.height) * 2 + 1;
      }

      _getIntersection() {
        this.raycaster.setFromCamera(this.mouse, this.camera);
        const intersects = this.raycaster.intersectObjects(this.allMeshes, false);
        if (intersects.length > 0) {
          return this.meshToPartMap.get(intersects[0].object) || null;
        }
        return null;
      }

      _onMouseMove(event) {
        const now = performance.now();
        if (now - this._lastHoverCheck < this._hoverThrottle) return;
        this._lastHoverCheck = now;
        this._updateMouse(event);
        const part = this._getIntersection();
        if (part !== this.hoveredPart) {
          this._resetHighlight(this.hoveredPart);
          this.hoveredPart = part;
          this._setHoverHighlight(part);
          if (this.onHover) this.onHover(part);
          this.domElement.style.cursor = part ? 'pointer' : 'grab';
        }
      }

      _onClick(event) {
        this._updateMouse(event);
        this._handleClick(event);
      }

      _handleClick(pos) {
        this._updateMouse(pos);
        const part = this._getIntersection();
        if (part) {
          this._selectPart(part);
        } else {
          this._deselectPart();
        }
      }

      _selectPart(part) {
        if (this.selectedPart && this.selectedPart !== part) {
          this._resetSelectHighlight(this.selectedPart);
        }
        this.selectedPart = part;
        this._setSelectHighlight(part);
        if (this.onSelect) this.onSelect(part);
      }

      _deselectPart() {
        if (this.selectedPart) {
          this._resetSelectHighlight(this.selectedPart);
          this.selectedPart = null;
          if (this.onSelect) this.onSelect(null);
        }
      }

      _modifyEmissive(part, color, intensity) {
        if (!part) return;
        part.pivot.traverse(child => {
          if (child.isMesh && child.material) {
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach(mat => {
              if (mat.emissive) {
                mat.emissive = new THREE.Color(color);
                mat.emissiveIntensity = intensity;
              }
            });
          }
        });
      }

      _setHoverHighlight(part) {
        if (part && part !== this.selectedPart) {
          this._modifyEmissive(part, '#444444', 0.4);
        }
      }

      _resetHighlight(part) {
        if (part && part !== this.selectedPart) {
          this._modifyEmissive(part, '#000000', 0);
        }
      }

      _setSelectHighlight(part) {
        this._modifyEmissive(part, '#ff6600', 0.7);
      }

      _resetSelectHighlight(part) {
        this._modifyEmissive(part, '#000000', 0);
      }

      deselect() {
        this._deselectPart();
        if (this.hoveredPart) {
          this._resetHighlight(this.hoveredPart);
          this.hoveredPart = null;
        }
      }
    }

    // ===== Toast =====
    class Toast {
      constructor(el) {
        this.el = el;
        this.timer = null;
      }
      show(msg, duration = 2000) {
        if (this.timer) clearTimeout(this.timer);
        this.el.textContent = msg;
        this.el.classList.add('show');
        this.timer = setTimeout(() => {
          this.el.classList.remove('show');
          this.timer = null;
        }, duration);
      }
    }

    // ===== App =====
    class App {
      constructor() {
        this.sceneManager = null;
        this.extractor = null;
        this.explosionController = null;
        this.interactionManager = null;
        this.toast = null;
        this.selectedPartId = null;
        this.isDark = true;
        this.parts = [];

        this.canvasContainer = document.getElementById('canvas-container');
        this.sidebar = document.getElementById('sidebar');
        this.infoPanel = document.getElementById('info-panel');
        this.slider = document.getElementById('explosion-slider');
        this.sliderValue = document.getElementById('slider-value');
        this.toastEl = document.getElementById('toast');
        this.loadingOverlay = document.getElementById('loading-overlay');
        this.progressFill = document.getElementById('progress-fill');
        this.loadingText = document.getElementById('loading-text');
        this._introWasPlaying = false;
      }

      async init() {
        this.toast = new Toast(this.toastEl);

        // Init 3D scene
        this.sceneManager = new SceneManager(this.canvasContainer);
        this.sceneManager.init();

        // Bind events
        this.bindEvents();
        this.clock = new THREE.Clock();
        this.animate();

        // Load car
        await this.loadCar();
      }

      async loadCar() {
        // Reset state
        this.selectedPartId = null;
        this.infoPanel.classList.remove('has-selection', 'sheet-open');
        this.infoPanel.classList.add('hidden');
        this.slider.value = 0;
        this.sliderValue.textContent = '0%';

        // Show loading
        this.loadingOverlay.classList.remove('hidden');
        this.progressFill.style.width = '0%';
        this.progressFill.style.background = '';
        this.loadingText.textContent = `加载 ${CAR.name}...`;

        // Clean up old parts
        if (this.extractor) {
          this.sceneManager.scene.remove(this.extractor.pivotGroup);
        }
        this.parts = [];
        this.explosionController = null;
        this.interactionManager = null;

        // Load and extract model
        this.extractor = new ModelPartExtractor(this.sceneManager.scene);

        try {
          this.parts = await this.extractor.loadAndExtract(CAR.modelPath, (pct) => {
            const percent = Math.round(pct * 100);
            this.progressFill.style.width = percent + '%';
            if (percent < 40) this.loadingText.textContent = `下载模型中... ${percent}%`;
            else if (percent < 70) this.loadingText.textContent = `解析贴图... ${percent}%`;
            else this.loadingText.textContent = `构建部件... ${percent}%`;
          });
        } catch (err) {
          console.error('Failed to load model:', err);
          this.loadingText.innerHTML = `<div style="text-align:center;color:#e74c3c;"><div style="font-size:1.2rem;margin-bottom:0.5rem;">❌ 模型加载失败</div><div style="font-size:0.7rem;margin-bottom:0.5rem;word-break:break-all;">${err.message || err}</div><div style="font-size:0.65rem;margin-top:0.5rem;color:#999;">${CAR.modelPath}</div></div>`;
          this.progressFill.style.width = '100%';
          this.progressFill.style.background = '#e74c3c';
          return;
        }

        setTimeout(() => { this.loadingOverlay.classList.add('hidden'); }, 400);

        if (this.parts.length === 0) {
          this.loadingText.textContent = '⚠️ 未能提取到任何模型部件';
          return;
        }

        // Update camera
        const cp = CAR.cameraPos;
        const ct = CAR.cameraTarget;
        this.sceneManager.camera.position.set(...cp);
        this.sceneManager.controls.target.set(...ct);
        this.sceneManager.defaultCameraPos = new THREE.Vector3(...cp);
        this.sceneManager.defaultTarget = new THREE.Vector3(...ct);
        this.sceneManager.controls.update();

        // Init controllers
        this.explosionController = new ExplosionController(this.parts);
        this.interactionManager = new InteractionManager(
          this.sceneManager.camera, this.sceneManager.renderer.domElement, this.parts
        );
        this.interactionManager.onSelect = (part) => {
          if (part) this.selectPart(part.id); else this.deselectPart();
        };

        // Rebuild sidebar
        this.buildCategoryButtons();

        // Intro
        setTimeout(() => {
          this.explosionController.startIntro();
          this.slider.value = 35;
          this.sliderValue.textContent = '35%';
          this.toast.show(`🏎️ ${CAR.name} · 点击部件查看详情`, 5000);
        }, 600);

        this.toast.show(`✅ 已加载 ${CAR.name}`, 3000);
      }

      buildCategoryButtons() {
        // Get category part counts
        const catMap = this.extractor.getCategoryParts();

        this.sidebar.innerHTML = '<div class="section-title">系统分类</div>';
        CATEGORIES.forEach(cat => {
          const count = (catMap[cat.id] || []).length;
          if (count === 0) return; // Skip empty categories

          const btn = document.createElement('button');
          btn.className = 'cat-btn';
          btn.dataset.category = cat.id;
          btn.style.setProperty('--cat-color', cat.color);
          btn.innerHTML = `
            <span class="dot" style="background:${cat.color}"></span>
            <span>${cat.labelZh}</span>
            <span class="part-count">${count}</span>
          `;
          btn.addEventListener('click', () => this.toggleCategory(cat.id, btn));
          this.sidebar.appendChild(btn);
        });
      }

      toggleCategory(categoryId, btn) {
        if (!this.explosionController) return;
        const isActive = this.explosionController.toggleCategory(categoryId);
        if (isActive) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
        const cat = CATEGORIES.find(c => c.id === categoryId);
        this.toast.show(`${isActive ? '💥 爆炸:' : '🔧 组装:'} ${cat ? cat.labelZh : categoryId}`);
      }

      bindEvents() {
        window.addEventListener('resize', () => this.sceneManager.resize());

        document.getElementById('btn-theme').addEventListener('click', () => this.toggleTheme());
        document.getElementById('btn-reset').addEventListener('click', () => {
          this.sceneManager.resetCamera(true);
          this.toast.show('🔄 视角已重置');
        });
        document.getElementById('btn-help').addEventListener('click', () => {
          this.toast.show('🖱 拖拽=旋转 | 滚轮=缩放 | 右键=平移 | R=重置 | 0-8=快捷键 | Esc=取消选中', 5000);
        });
        document.getElementById('btn-close-info').addEventListener('click', () => {
          this.deselectPart();
        });

        this.slider.addEventListener('input', () => {
          const val = parseInt(this.slider.value);
          this.sliderValue.textContent = val + '%';
          this.explosionController.setGlobalFactor(val / 100);
        });

        window.addEventListener('keydown', (e) => {
          if (e.target.tagName === 'INPUT') return;
          switch (e.key.toLowerCase()) {
            case 'r':
              this.sceneManager.resetCamera(true);
              this.toast.show('🔄 视角已重置');
              break;
            case 'escape':
              this.deselectPart();
              break;
            case '0':
              this.slider.value = 0;
              this.sliderValue.textContent = '0%';
              this.explosionController.assembleAll();
              this.sidebar.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
              this.toast.show('🔧 全部组装');
              break;
            default:
              const cat = CATEGORIES.find(c => c.shortcut === e.key);
              if (cat) {
                const btn = this.sidebar.querySelector(`[data-category="${cat.id}"]`);
                if (btn) this.toggleCategory(cat.id, btn);
              }
              break;
          }
        });

        // Mobile swipe
        let touchStartY = 0;
        this.infoPanel.addEventListener('touchstart', (e) => {
          touchStartY = e.touches[0].clientY;
        }, { passive: true });
        this.infoPanel.addEventListener('touchmove', (e) => {
          if (e.touches[0].clientY - touchStartY > 50) {
            this.deselectPart();
          }
        }, { passive: true });
      }

      toggleTheme() {
        this.isDark = !this.isDark;
        document.documentElement.setAttribute('data-theme', this.isDark ? '' : 'light');
        this.sceneManager.updateTheme(this.isDark);
        localStorage.setItem('f1-state', JSON.stringify({ theme: this.isDark ? 'dark' : 'light' }));
      }

      selectPart(partId) {
        if (this.selectedPartId === partId) return;
        this.selectedPartId = partId;
        const part = this.parts.find(p => p.id === partId);
        if (!part) return;

        const catInfo = CATEGORIES.find(c => c.id === part.category);
        document.getElementById('info-category').textContent = catInfo ? catInfo.labelZh : part.category;
        const catColor = catInfo ? catInfo.color : '#999';
        document.getElementById('info-category').style.setProperty('--cat-color', catColor);
        document.getElementById('info-category').style.background = catColor;
        document.getElementById('info-name').textContent = part.zh || part.meshName;
        document.getElementById('info-function').textContent = part.func || '';
        const specsList = document.getElementById('info-specs');
        specsList.innerHTML = (part.specs || []).map(s => `<li>${s}</li>`).join('');

        this.infoPanel.classList.add('has-selection');
        this.infoPanel.classList.remove('hidden');

        if (window.innerWidth <= 860) {
          this.infoPanel.classList.add('sheet-open');
        }

        this.toast.show(`已选择: ${part.zh || part.meshName}`);
      }

      deselectPart() {
        if (this.interactionManager) this.interactionManager.deselect();
        this.selectedPartId = null;
        this.infoPanel.classList.remove('has-selection');
        this.infoPanel.classList.add('hidden');
        if (window.innerWidth <= 860) {
          this.infoPanel.classList.remove('sheet-open');
        }
      }

      animate() {
        requestAnimationFrame(() => this.animate());
        const delta = Math.min(this.clock.getDelta(), 0.1);

        if (this.explosionController) {
          this.explosionController.update(delta);

          if (this.explosionController.introPlaying) {
            const displayVal = Math.round(this.explosionController.getDisplayFactor() * 100);
            this.slider.value = displayVal;
            this.sliderValue.textContent = displayVal + '%';
            this._introWasPlaying = true;
          } else if (this._introWasPlaying) {
            this.slider.value = 0;
            this.sliderValue.textContent = '0%';
            this._introWasPlaying = false;
          }
        }

        this.sceneManager.updateCameraAnim(delta);
        this.sceneManager.controls.update();
        this.sceneManager.renderer.render(this.sceneManager.scene, this.sceneManager.camera);
      }
    }

    // ===== Bootstrap =====
    const app = new App();
    app.init();

    console.log(`🏎️  F1 Exploded View - ${CAR.name}`);
    console.log('   glTF Model Loader ✓');
    console.log('   Part Extraction ✓');
    console.log('   Explosion Controller ✓');
    console.log('   Interaction Manager ✓');
  </script>
</body>
</html>
