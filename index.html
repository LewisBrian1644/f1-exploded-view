<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 爆炸视图 - Aston Martin AMR26</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='28' font-size='28'%3E%F0%9F%8F%8E%3C/text%3E%3C/svg%3E">
  <script>
    (function() {
      var state = JSON.parse(localStorage.getItem('f1-state') || '{}');
      if (state.theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>

  <!-- Three.js Import Map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    /* ===== CSS Variables / Theming ===== */
    :root {
      --color-bg:           #1a1a1a;
      --color-surface:      #2a2a2a;
      --color-surface-alt:  #333333;
      --color-text:         #e8e8e8;
      --color-text-muted:   #999999;
      --color-primary:      #e10600;
      --color-primary-hover:#ff1a14;
      --color-accent:       #3498db;
      --color-accent-hover: #5dade2;
      --color-border:       #404040;
      --color-shadow:       rgba(0,0,0,0.5);
      --color-glass:        rgba(30,30,30,0.92);
      --radius:             12px;
      --radius-sm:          8px;
      --font-mono:          'Consolas', 'Courier New', monospace;
      --font-sans:          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      --transition-theme:   background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s;

      /* F1 Category Colors */
      --cat-powerunit:      #e74c3c;
      --cat-chassis:        #f39c12;
      --cat-aero:           #3498db;
      --cat-suspension:     #2ecc71;
      --cat-elec:           #9b59b6;
      --cat-cooling:        #1abc9c;
      --cat-cockpit:        #e67e22;
      --cat-wheels:         #95a5a6;
    }

    [data-theme="light"] {
      --color-bg:           #f0f2f5;
      --color-surface:      #ffffff;
      --color-surface-alt:  #f8f9fa;
      --color-text:         #212529;
      --color-text-muted:   #6c757d;
      --color-primary:      #e10600;
      --color-primary-hover:#c70500;
      --color-accent:       #2980b9;
      --color-accent-hover: #1a6a9a;
      --color-border:       #dee2e6;
      --color-shadow:       rgba(0,0,0,0.1);
      --color-glass:        rgba(255,255,255,0.92);
    }

    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
      height: 100vh;
      overflow: hidden;
      transition: var(--transition-theme);
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ===== Main Layout ===== */
    #app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      grid-template-columns: 260px 1fr 320px;
      grid-template-areas:
        "header  header header"
        "sidebar canvas info"
        "bottombar bottombar bottombar";
      height: 100vh;
    }

    /* ===== Header ===== */
    #header {
      grid-area: header;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 1rem;
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      z-index: 10;
    }

    #header .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    #header .logo .f1-badge {
      background: var(--color-primary);
      color: #fff;
      font-weight: 900;
      font-style: italic;
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      font-size: 0.9rem;
      letter-spacing: -0.02em;
    }

    #header .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .icon-btn {
      background: var(--color-surface-alt);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-theme), transform 0.15s;
    }

    .icon-btn:hover {
      background: var(--color-border);
      transform: scale(1.05);
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    /* ===== 3D Canvas Container ===== */
    #canvas-container {
      grid-area: canvas;
      position: relative;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    #canvas-container canvas {
      display: block;
    }

    /* ===== Loading Overlay ===== */
    #loading-overlay {
      position: absolute;
      inset: 0;
      background: var(--color-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 50;
      transition: opacity 0.5s, visibility 0.5s;
    }

    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #loading-overlay .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading-overlay .progress-bar {
      width: 260px;
      height: 4px;
      background: var(--color-border);
      border-radius: 2px;
      overflow: hidden;
    }

    #loading-overlay .progress-fill {
      height: 100%;
      background: var(--color-primary);
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s;
    }

    #loading-overlay .loading-text {
      font-size: 0.85rem;
      color: var(--color-text-muted);
    }

    #loading-overlay .loading-sub {
      font-size: 0.7rem;
      color: var(--color-text-muted);
      max-width: 280px;
      text-align: center;
      line-height: 1.4;
    }

    /* ===== Sidebar - Category Filters ===== */
    #sidebar {
      grid-area: sidebar;
      background: var(--color-surface);
      border-right: 1px solid var(--color-border);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      overflow-y: auto;
      z-index: 5;
    }

    #sidebar .section-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-text-muted);
      margin-bottom: 0.25rem;
      margin-top: 0.5rem;
    }

    #sidebar .section-title:first-child {
      margin-top: 0;
    }

    #sidebar .part-count {
      font-size: 0.7rem;
      color: var(--color-text-muted);
      margin-left: auto;
    }

    .cat-btn {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.75rem;
      border: 2px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--color-text);
      cursor: pointer;
      font-size: 0.85rem;
      font-family: var(--font-sans);
      transition: var(--transition-theme), transform 0.12s, border-color 0.2s;
      text-align: left;
      width: 100%;
    }

    .cat-btn:hover {
      border-color: var(--color-text-muted);
    }

    .cat-btn:active {
      transform: scale(0.97);
    }

    .cat-btn .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .cat-btn.active {
      border-color: var(--cat-color, var(--color-accent));
      background: color-mix(in srgb, var(--cat-color, var(--color-accent)) 10%, transparent);
    }

    /* ===== Info Panel ===== */
    #info-panel {
      grid-area: info;
      background: var(--color-surface);
      border-left: 1px solid var(--color-border);
      padding: 1rem;
      overflow-y: auto;
      z-index: 5;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    #info-panel.hidden {
      opacity: 0.4;
    }

    #info-panel .panel-placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
      text-align: center;
      gap: 0.5rem;
      font-size: 0.9rem;
    }

    #info-panel .panel-placeholder .icon {
      font-size: 3rem;
      opacity: 0.3;
    }

    #info-panel .panel-content {
      display: none;
      flex-direction: column;
      gap: 0.75rem;
    }

    #info-panel.has-selection .panel-placeholder {
      display: none;
    }

    #info-panel.has-selection .panel-content {
      display: flex;
    }

    #info-panel .part-name {
      font-size: 1.15rem;
      font-weight: 700;
    }

    #info-panel .part-category {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #fff;
      background: var(--cat-color);
      align-self: flex-start;
    }

    #info-panel .part-function {
      font-size: 0.88rem;
      line-height: 1.5;
      color: var(--color-text);
    }

    #info-panel .part-specs {
      list-style: none;
      padding: 0;
    }

    #info-panel .part-specs li {
      font-size: 0.82rem;
      padding: 0.35rem 0;
      border-bottom: 1px solid var(--color-border);
      color: var(--color-text-muted);
    }

    #info-panel .part-specs li:last-child {
      border-bottom: none;
    }

    #info-panel .part-specs li::before {
      content: '▸ ';
      color: var(--color-primary);
    }

    /* Upgrade history dropdown */
    .upgrade-section {
      margin-top: 14px;
      border-top: 1px solid var(--color-border);
      padding-top: 12px;
    }
    .upgrade-section[open] .upgrade-summary {
      margin-bottom: 8px;
    }
    .upgrade-summary {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-text-muted);
      list-style: none;
      user-select: none;
    }
    .upgrade-summary::-webkit-details-marker {
      display: none;
    }
    .upgrade-summary::before {
      content: '▶ ';
      font-size: 0.6rem;
      transition: transform 0.2s;
      display: inline-block;
    }
    .upgrade-section[open] .upgrade-summary::before {
      transform: rotate(90deg);
    }
    .upgrade-count {
      background: var(--color-primary);
      color: #fff;
      font-size: 0.65rem;
      padding: 1px 7px;
      border-radius: 10px;
    }
    .upgrade-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .upgrade-item {
      background: var(--color-surface-alt);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.7rem;
    }
    .upgrade-item .upgrade-race {
      font-weight: 600;
      color: var(--color-primary);
      margin-bottom: 3px;
    }
    .upgrade-item .upgrade-purpose {
      color: var(--color-text);
      margin-bottom: 2px;
    }
    .upgrade-item .upgrade-date {
      color: var(--color-text-muted);
      font-size: 0.65rem;
    }
    .upgrade-empty {
      font-size: 0.7rem;
      color: var(--color-text-muted);
      font-style: italic;
    }

    /* ===== Bottom Bar - Explosion Slider ===== */
    #bottombar {
      grid-area: bottombar;
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      padding: 0.6rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      z-index: 10;
    }

    #bottombar .slider-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--color-text-muted);
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #explosion-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      background: var(--color-border);
      outline: none;
      cursor: pointer;
    }

    #explosion-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--color-primary);
      border: 3px solid var(--color-surface);
      cursor: pointer;
      box-shadow: 0 2px 6px var(--color-shadow);
      transition: transform 0.1s;
    }

    #explosion-slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    #bottombar .slider-value {
      font-size: 0.9rem;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--color-primary);
      min-width: 3rem;
      text-align: right;
    }

    #bottombar .hint {
      font-size: 0.72rem;
      color: var(--color-text-muted);
      white-space: nowrap;
      margin-left: auto;
    }

    /* ===== Toast ===== */
    #toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      font-size: 0.85rem;
      box-shadow: 0 4px 16px var(--color-shadow);
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      z-index: 100;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== Responsive - Tablet ===== */
    @media (max-width: 1200px) {
      #app {
        grid-template-columns: 220px 1fr 280px;
      }
    }

    /* ===== Responsive - Mobile ===== */
    @media (max-width: 860px) {
      #app {
        grid-template-rows: auto auto 1fr auto;
        grid-template-columns: 1fr;
        grid-template-areas:
          "header"
          "bottombar"
          "canvas"
          "categories";
      }

      #bottombar {
        border-top: none;
        border-bottom: 1px solid var(--color-border);
      }

      #sidebar {
        grid-area: categories;
        border-right: none;
        border-top: 1px solid var(--color-border);
        flex-direction: row;
        flex-wrap: wrap;
        gap: 0.35rem;
        padding: 0.5rem;
        overflow-y: visible;
      }

      #sidebar .section-title {
        display: none;
      }

      .cat-btn {
        font-size: 0.72rem;
        padding: 0.35rem 0.55rem;
        gap: 0.3rem;
        white-space: nowrap;
      }

      .cat-btn .dot {
        width: 8px;
        height: 8px;
      }

      #info-panel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        max-height: 40vh;
        border-left: none;
        border-top: 1px solid var(--color-border);
        border-radius: 16px 16px 0 0;
        transform: translateY(100%);
        transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 -4px 20px var(--color-shadow);
        z-index: 20;
      }

      #info-panel.sheet-open {
        transform: translateY(0);
      }

      #bottombar {
        padding: 0.5rem 1rem;
        gap: 0.6rem;
      }

      #bottombar .hint {
        display: none;
      }
    }

    @media (max-width: 480px) {
      #header .logo span:last-child {
        display: none;
      }

      #bottombar .slider-label {
        font-size: 0.7rem;
      }

      .cat-btn {
        font-size: 0.68rem;
        padding: 0.3rem 0.45rem;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <div class="logo">
        <span class="f1-badge">F1</span>
        <span>EXPLODED VIEW · AMR26</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-theme" title="切换主题">🌓</button>
        <button class="icon-btn" id="btn-reset" title="重置视角">🔄</button>
        <button class="icon-btn" id="btn-help" title="帮助">?</button>
      </div>
    </header>

    <!-- 3D Canvas -->
    <div id="canvas-container">
      <!-- Loading Overlay -->
      <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="loading-text" id="loading-text">加载 3D 模型中...</div>
        <div class="loading-sub" id="loading-sub">模型文件约 4MB，首次加载请耐心等待</div>
      </div>
    </div>

    <!-- Sidebar - Category Filters -->
    <aside id="sidebar">
      <div class="section-title">系统分类</div>
    </aside>

    <!-- Info Panel -->
    <aside id="info-panel" class="hidden">
      <div class="panel-placeholder">
        <div class="icon">🏎️</div>
        <div>点击赛车部件<br>查看详细技术信息</div>
      </div>
      <div class="panel-content">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div class="part-category" id="info-category"></div>
          <button class="icon-btn" id="btn-close-info" title="关闭" style="flex-shrink:0;">✕</button>
        </div>
        <div class="part-name" id="info-name"></div>
        <p class="part-function" id="info-function"></p>
        <ul class="part-specs" id="info-specs"></ul>
        <details class="upgrade-section" id="upgrade-section" style="display:none;">
          <summary class="upgrade-summary">
            <span>🔧 升级过程</span>
            <span class="upgrade-count" id="upgrade-count"></span>
          </summary>
          <div class="upgrade-list" id="upgrade-list"></div>
          <div class="upgrade-empty" id="upgrade-empty">暂无升级记录</div>
        </details>
      </div>
    </aside>

    <!-- Bottom Bar -->
    <div id="bottombar">
      <span class="slider-label">💥 爆炸程度</span>
      <input type="range" id="explosion-slider" min="0" max="100" value="0" step="1">
      <span class="slider-value" id="slider-value">0%</span>
      <span class="hint">🖱 拖拽=旋转 | 滚轮=缩放 | 右键=平移 | R=重置</span>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    // ===== DRACO Decoder (shared) =====
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');

    // ===== Constants =====
    const CATEGORIES = [
      { id: 'chassis',    label: 'Chassis',        labelZh: '底盘/车身',   color: '#f39c12', shortcut: '1' },
      { id: 'powerunit',  label: 'Power Unit',     labelZh: '动力单元',     color: '#e74c3c', shortcut: '2' },
      { id: 'aero',       label: 'Aerodynamics',   labelZh: '空气动力学',   color: '#3498db', shortcut: '3' },
      { id: 'cockpit',    label: 'Cockpit',        labelZh: '座舱',         color: '#e67e22', shortcut: '4' },
      { id: 'wheels',     label: 'Wheels & Tyres', labelZh: '车轮轮胎',     color: '#95a5a6', shortcut: '5' },
      { id: 'elec',       label: 'Electronics',    labelZh: '电子/灯光',    color: '#9b59b6', shortcut: '6' },
      { id: 'suspension', label: 'Suspension',     labelZh: '悬挂/刹车',    color: '#2ecc71', shortcut: '7' },
      { id: 'cooling',    label: 'Cooling',        labelZh: '冷却系统',     color: '#1abc9c', shortcut: '8' },
    ];

    // ===== 🏎️ 车辆配置 =====
    const CAR = {
      name: 'Aston Martin AMR26',
      modelPath: 'model/scene-compressed.glb',
      modelSizeEstimate: 4.4 * 1024 * 1024,  // ~4.4MB — used for indeterminate progress bar
      cameraPos: [3.5, 2.0, 5.5],
      cameraTarget: [0, 0.2, 0.5],
      // 手动爆炸覆盖: { 部件中文名: [dx, dy, dz] } — 空对象表示全部用算法
      explosionOverrides: {},
      // 爆炸倍率 (相对CINTURE_OFF中心): exploded.x = original.x * magX, .y = original.y * magY, .z = original.z * magZ
      explosionMagnification: { x: 3, y: 13, z: 3 },
    };

    // ===== Object_# → 真实F1部件名称与描述 =====
    CAR.objectNames = {
      // ── 安全带打开 ──
      'Object_728': { zh: '安全带打开', cat: 'cockpit' },
      'Object_732': { zh: '安全带打开', cat: 'cockpit' },

      // ── 安全带关闭 ──
      'Object_684': { zh: '安全带关闭', cat: 'cockpit' },
      'Object_688': { zh: '安全带关闭', cat: 'cockpit' },
      'Object_692': { zh: '安全带关闭', cat: 'cockpit' },
      'Object_696': { zh: '安全带关闭', cat: 'cockpit' },
      'Object_700': { zh: '安全带关闭', cat: 'cockpit' },
      'Object_704': { zh: '安全带关闭', cat: 'cockpit' },

    // 根据 mesh 名称解析中文名、分类和专业描述
    function resolveMeshName(name) {
      const entry = CAR.objectNames[name] || CAR.namedMeshInfo[name];
      if (entry) return { zh: entry.zh, category: entry.cat, desc: entry.desc || '' };
      if (/^Object_\d+$/.test(name)) return { zh: '未识别零件(' + name + ')', category: 'chassis', desc: '' };
      return null;
    }

    // ===== 命名 Mesh → F1部件名称与描述 =====
    CAR.namedMeshInfo = {
      chasis:             { zh: '单体壳底盘',     cat: 'chassis', desc: '碳纤维复合材料底盘主体（Monocoque / Survival Cell），F1赛车最核心的安全结构。由超过12层不同方向的碳纤维预浸布和蜂窝铝芯材在高压釜中固化成型，形成一件完整的"生存舱"。通过FIA严格的碰撞测试——包括正面、侧面、后方撞击和静态挤压测试。' },
      chassis2:           { zh: '底盘上部结构',   cat: 'chassis', desc: '底盘上部的碳纤维结构，连接单体壳与后部动力单元安装点，并为座舱开口和Halo提供结构支撑。上部的几何形状同时作为引擎盖和侧箱的空气动力学基准面。' },
      carbon:             { zh: '碳纤维引擎盖',   cat: 'chassis', desc: '碳纤维复合材料（Carbon Fiber Composite）制成的引擎盖面板。覆盖从座舱后方到尾翼前缘的全部动力单元区域。2026年赛车引擎盖集成了鲨鱼鳍（Shark Fin）以增强侧风中的方向稳定性。' },
      generics:           { zh: '通用碳纤维结构件', cat: 'chassis', desc: '多种辅助碳纤维结构件的集合。包括内部支架、面板支撑和传感器安装座。这类"通用件"虽然不直接参与主要载荷传递，但对于维持赛车整体结构完整性至关重要。' },
      NEGRO:              { zh: '哑光黑色面板',   cat: 'chassis', desc: '黑色亚光表面处理的碳纤维车身面板。F1赛车大量使用裸露碳纤维（Exposed Carbon）以减轻重量——喷漆会增加约1-2kg重量。亚光处理减少阳光反射对车手视线的干扰。' },
      BLACK:              { zh: '黑色装饰面板',   cat: 'chassis', desc: '黑色外观的碳纤维覆盖面板，用于车身非结构区域的视觉处理。这些面板将内部复杂机械系统与外部气流隔离，形成平滑的空气动力学表面。' },
      chrome:             { zh: '镀铬装饰条',     cat: 'chassis', desc: '具有金属光泽的表面装饰元素。虽然视觉上类似镀铬，实际使用的是轻质金属化薄膜而非金属镀层，以避免增加重量和潜在的电磁干扰问题。' },
      redbull_detail:     { zh: '车身气动细节件', cat: 'aero', desc: '车身表面的精细空气动力学附件。包括气流引导叶片（Vane）、涡流发生器（Vortex Generator）和边界层控制装置。这些微小但关键的部件通过产生受控涡流来管理车身表面气流分离点。' },
      decal:              { zh: '赞助商涂装贴花', cat: 'chassis', desc: '车身表面的赞助商品牌标识涂装（Livery）。F1使用高性能乙烯基贴膜，全车贴花总重仅150-200克。赞助商标识的尺寸、位置和对比度均受合同和FIA技术规则严格约束。' },

      TIRE_SIDES:         { zh: '轮胎侧壁',       cat: 'wheels', desc: 'Pirelli P Zero F1轮胎的侧壁（Sidewall），标有Pirelli P Zero和轮胎配方标识。侧壁上不同颜色的条纹（白/黄/红/紫/绿/蓝）分别代表C0至C5不同硬度配方。侧壁刚度直接影响轮胎接地印迹的形状。' },
      TIRE_TREAD:         { zh: '轮胎胎面',       cat: 'wheels', desc: 'F1轮胎的胎面（Tread）部分，2026年规格为前305mm/后405mm宽度的18英寸轮胎。光头胎（Slick）设计，无花纹，在干地条件下最大化橡胶分子与赛道表面的接触面积。工作温度窗口80-120°C，低于此温度抓地力急剧下降。' },
      discs:              { zh: '碳-碳刹车碟',    cat: 'wheels', desc: '碳纤维增强碳基复合材料（Carbon-Carbon）制动碟盘。可在高达1000°C的工作温度下维持稳定的摩擦系数。表面密集的通风孔（多达1400+个）利用离心力将热量从中心向外排出。一套刹车碟价值超过€10,000。' },
      redbull_wheel_hub:  { zh: '镁合金轮毂',     cat: 'wheels', desc: '镁合金锻造轮毂（Wheel Hub），通过中心锁紧螺母和空心半轴与赛车连接。集成了红外温度传感器阵列和胎压监测传感器（TPMS），数据通过无线遥测实时传输至维修区工程师屏幕。' },

      cockpit:            { zh: '座舱碳纤维壳体', cat: 'cockpit', desc: '座舱区域的碳纤维壳体部分。座舱是车手的工作空间，内部温度可高达50°C。碳纤维壳体上精密加工出座椅安装面、安全带固定点和方向盘转向柱安装座，所有尺寸根据车手体型定制。' },
      cockpit_black_s:    { zh: '座舱内衬面板',   cat: 'cockpit', desc: '座舱内部的黑色耐高温面板。由芳纶（Kevlar®）和碳纤维混编复合材料制成，在高温下不释放有毒气体。面板设计有冷却空气导流槽，引导气流在车手身体周围流动。' },
      cockpit_metal:      { zh: '座舱金属加强框', cat: 'cockpit', desc: '座舱开口周围的钛合金/高强度铝合金加强框架。在侧向碰撞时保护车手，同时承受Halo装置的载荷。此框架是单体壳中唯一的非碳纤维主要结构件。' },
      cockpit_foam:       { zh: '防火吸能泡棉',   cat: 'cockpit', desc: 'Nomex®防火泡棉，填充于车手与单体壳之间的空隙。具有双重功能：1）在碰撞中吸收冲击能量；2）在火灾中提供防火隔热屏障。Nomex材料在800°C火焰中不熔化、不燃烧。' },

    // ===== Upgrade History =====
    const UPGRADES_KEY = 'f1-upgrade-data';
    const PARTS_KEY = 'f1-parts-catalog';

    function loadUpgrades() {
      try {
        return JSON.parse(localStorage.getItem(UPGRADES_KEY)) || {};
      } catch { return {}; }
    }

    function getPartUpgrades(partName) {
      return loadUpgrades()[partName] || [];
    }

    function renderUpgradeList(partName) {
      const section = document.getElementById('upgrade-section');
      const list = document.getElementById('upgrade-list');
      const empty = document.getElementById('upgrade-empty');
      const count = document.getElementById('upgrade-count');
      const upgrades = getPartUpgrades(partName);

      if (upgrades.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = '';
      count.textContent = `${upgrades.length} 次`;
      empty.style.display = 'none';
      list.style.display = '';
      list.innerHTML = upgrades.map((u, i) => `
        <div class="upgrade-item">
          <div class="upgrade-race">${i + 1}. ${u.race}</div>
          <div class="upgrade-purpose">目的：${u.purpose}</div>
          ${u.date ? `<div class="upgrade-date">${u.date}</div>` : ''}
        </div>
      `).join('');
    }

    // Sync parts catalog to localStorage so admin page can read it
    function syncPartsCatalog() {
      try {
        if (!localStorage.getItem(PARTS_KEY)) {
          const names = [...new Set(Object.values(CAR.objectNames).map(o => o.zh))].sort();
          localStorage.setItem(PARTS_KEY, JSON.stringify(names));
        }
      } catch {}
    }
    syncPartsCatalog();

    // ===== SceneManager =====
    class SceneManager {
      constructor(container) {
        this.container = container;
        this.renderer = null;
        this.scene = null;
        this.camera = null;
        this.controls = null;
      }

      init() {
        const w = this.container.clientWidth;
        const h = this.container.clientHeight;

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setSize(w, h);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 1.1;
        this.container.appendChild(this.renderer.domElement);

        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color('#1a1a1a');
        this.scene.fog = new THREE.Fog('#1a1a1a', 8, 30);

        this.camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
        this.camera.position.set(...CAR.cameraPos);
        this.camera.lookAt(...CAR.cameraTarget);

        // Lights
        const ambient = new THREE.AmbientLight('#8899bb', 0.7);
        this.scene.add(ambient);

        const hemi = new THREE.HemisphereLight('#b1c8e0', '#333333', 0.5);
        this.scene.add(hemi);

        const keyLight = new THREE.DirectionalLight('#ffffff', 3.0);
        keyLight.position.set(5, 8, 4);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 2048;
        keyLight.shadow.mapSize.height = 2048;
        keyLight.shadow.camera.near = 0.5;
        keyLight.shadow.camera.far = 50;
        keyLight.shadow.camera.left = -10;
        keyLight.shadow.camera.right = 10;
        keyLight.shadow.camera.top = 10;
        keyLight.shadow.camera.bottom = -10;
        keyLight.shadow.bias = -0.0001;
        this.scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight('#8899cc', 0.8);
        fillLight.position.set(-3, 2, -2);
        this.scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight('#ffffff', 1.2);
        rimLight.position.set(0, 1, -4);
        this.scene.add(rimLight);

        // Ground plane
        const groundGeo = new THREE.PlaneGeometry(20, 20);
        const groundMat = new THREE.MeshStandardMaterial({ color: '#222222', roughness: 0.7, metalness: 0.1 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1.5;
        ground.receiveShadow = true;
        this.scene.add(ground);

        // Grid
        const gridHelper = new THREE.PolarGridHelper(8, 48, 24, 64, '#444444', '#333333');
        gridHelper.position.y = -1.49;
        this.scene.add(gridHelper);

        // OrbitControls
        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.target.set(0, 0.2, 0.5);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.08;
        this.controls.minDistance = 1.5;
        this.controls.maxDistance = 12;
        this.controls.maxPolarAngle = Math.PI * 0.7;
        this.controls.minPolarAngle = 0.2;
        this.controls.update();

        this.defaultCameraPos = this.camera.position.clone();
        this.defaultTarget = new THREE.Vector3(...CAR.cameraTarget);

        this._cameraAnimTarget = null;
        this._cameraAnimStart = null;
        this._cameraAnimTime = 0;
        this._cameraAnimDuration = 0.8;
      }

      resize() {
        const w = this.container.clientWidth;
        const h = this.container.clientHeight;
        this.renderer.setSize(w, h);
        this.camera.aspect = w / h;
        this.camera.updateProjectionMatrix();
      }

      resetCamera(animate = true) {
        if (animate) {
          this._cameraAnimTarget = { pos: this.defaultCameraPos.clone(), target: this.defaultTarget.clone() };
          this._cameraAnimStart = {
            pos: this.camera.position.clone(),
            target: this.controls.target.clone(),
          };
          this._cameraAnimTime = 0;
          this._cameraAnimDuration = 0.8;
        } else {
          this.camera.position.copy(this.defaultCameraPos);
          this.controls.target.copy(this.defaultTarget);
          this.controls.update();
        }
      }

      updateCameraAnim(delta) {
        if (!this._cameraAnimTarget) return false;
        this._cameraAnimTime += delta;
        const t = Math.min(this._cameraAnimTime / this._cameraAnimDuration, 1.0);
        const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        this.camera.position.lerpVectors(this._cameraAnimStart.pos, this._cameraAnimTarget.pos, ease);
        this.controls.target.lerpVectors(this._cameraAnimStart.target, this._cameraAnimTarget.target, ease);
        if (t >= 1.0) {
          this._cameraAnimTarget = null;
          return false;
        }
        return true;
      }

      updateTheme(isDark) {
        const bgColor = isDark ? '#1a1a1a' : '#e8ecf0';
        const fogColor = isDark ? '#1a1a1a' : '#e8ecf0';
        this.scene.background = new THREE.Color(bgColor);
        this.scene.fog = new THREE.Fog(fogColor, 8, 30);
      }
    }

    // ===== Model Loader & Part Extractor =====
    class ModelPartExtractor {
      constructor(scene) {
        this.scene = scene;
        this.pivotGroup = new THREE.Group(); // root for all extracted pivots
        this.scene.add(this.pivotGroup);
        this.parts = []; // { id, meshName, category, pivot, center, assembledPos, explodedPos }
        this.cintureOffCenter = new THREE.Vector3();
      }

      async loadAndExtract(gltfPath, onProgress) {
        const loader = new GLTFLoader();
        loader.setDRACOLoader(dracoLoader);

        // loadAsync accepts onProgress — gives us XHR byte-level events for the single .glb
        let lastUpdate = 0;
        const gltf = await loader.loadAsync(gltfPath, onProgress ? (e) => {
          // Throttle: DOM updates >50ms apart are invisible to users
          const now = performance.now();
          if (now - lastUpdate < 50) return;
          lastUpdate = now;
          if (e.lengthComputable && e.total > 0) {
            onProgress(e.loaded / e.total, 'download', { loaded: e.loaded, total: e.total });
          } else {
            onProgress(-1, 'download', { loaded: e.loaded, total: 0 });
          }
        } : undefined);

        // All files downloaded — begin processing
        if (onProgress) onProgress(0.90, 'parse');
        const model = gltf.scene;

        // Update world matrices after loading
        model.updateWorldMatrix(true, true);

        // Collect all meshes with their FULL world transforms
        // Also capture parent group name for diagnostics
        const meshes = [];

        // Helper: find the top-level group name for a node
        function findParentGroup(node, root) {
          let p = node.parent;
          while (p && p !== root && p.parent && p.parent !== root) {
            p = p.parent;
          }
          return (p && p !== root) ? (p.name || '(unnamed)') : '(root)';
        }

        model.traverse((child) => {
          if (child.isMesh && child.name) {
            const wp = new THREE.Vector3();
            const wq = new THREE.Quaternion();
            const ws = new THREE.Vector3();
            child.matrixWorld.decompose(wp, wq, ws);

            const parentGroup = findParentGroup(child, model);

            let zhName, category, desc;

            const info = resolveMeshName(child.name);
            if (info) {
              zhName = info.zh;
              category = info.category;
              desc = info.desc || '';
            } else {
              zhName = child.name.replace(/_/g, ' ');
              category = 'chassis';
              desc = '';
            }

            meshes.push({
              mesh: child,
              name: child.name,
              zhName: zhName,
              parentGroup,
              category: category,
              desc: desc,
              worldPos: wp.clone(),
              worldQuat: wq.clone(),
              worldScale: ws.clone(),
            });
          }
        });

        if (onProgress) onProgress(0.95, 'build');
        console.log(`Found ${meshes.length} named meshes`);

        // Compute CINTURE_OFF (安全带关闭) center as explosion origin
        let cintureOffCount = 0;
        this.cintureOffCenter.set(0, 0, 0);
        for (const m of meshes) {
          if (m.zhName === '安全带关闭') {
            this.cintureOffCenter.add(m.worldPos);
            cintureOffCount++;
          }
        }
        if (cintureOffCount > 0) {
          this.cintureOffCenter.divideScalar(cintureOffCount);
        } else {
          // Fallback: use model bounding box center
          const bbox = new THREE.Box3().expandByObject(model);
          bbox.getCenter(this.cintureOffCenter);
        }
        console.log('CINTURE_OFF center (explosion origin):', this.cintureOffCenter.toArray());

        // Group meshes by Chinese name (multiple meshes may share the same name)
        const groups = new Map(); // zhName → { meshes[], category }
        const catParts = {};      // category → count

        for (const m of meshes) {
          if (!groups.has(m.zhName)) {
            groups.set(m.zhName, { meshes: [], category: m.category });
            catParts[m.category] = (catParts[m.category] || 0) + 1;
          }
          groups.get(m.zhName).meshes.push(m);
        }

        const debugGroups = {};
        groups.forEach((g, name) => { debugGroups[name] = g.meshes.length; });
        console.log('Resolved groups:', JSON.stringify(debugGroups));
        console.log(`Grouped into ${groups.size} parts across ${Object.keys(catParts).length} categories`);

        // Quick debug: show sample groups and counts
        if (groups.size > 0) {
          const sample = [...groups.entries()].slice(0, 3);
          sample.forEach(([name, g]) => {
            console.log(`Part "${name}": meshes=${g.meshes.length}`);
          });
          console.log('CINTURE_OFF origin:', this.cintureOffCenter.toArray().map(v=>v.toFixed(2)));
        }

        // Create pivot groups for each mesh-name group
        let idx = 0;
        groups.forEach((group, zhName) => {
          if (group.meshes.length === 0) return;

          // Compute group center (average of all mesh world positions)
          const center = new THREE.Vector3();
          group.meshes.forEach(m => center.add(m.worldPos));
          center.divideScalar(group.meshes.length);

          // Create pivot group at the group center
          const pivot = new THREE.Group();
          pivot.position.copy(center);

          // Clone each mesh with correct world transform relative to pivot
          for (const m of group.meshes) {
            const clone = m.mesh.clone();

            // Set clone's local transform to match world transform
            clone.position.copy(m.worldPos).sub(center);
            clone.quaternion.copy(m.worldQuat);
            clone.scale.copy(m.worldScale);

            clone.castShadow = true;
            clone.receiveShadow = true;
            pivot.add(clone);
          }

          // Explosion: per-axis magnification (relative to CINTURE_OFF center)
          const mag = CAR.explosionMagnification;
          const original = center.clone().sub(this.cintureOffCenter);

          // Generate display name and description (use description from first mesh in group)
          const categoryZh = (CATEGORIES.find(c => c.id === group.category) || {}).labelZh || group.category;
          const descText = group.meshes[0]?.desc || `${categoryZh}组件 — ${zhName}。`;
          const func = descText || `${categoryZh}组件 — ${zhName}。${CAR.name} 精密赛车部件。`;
          const specs = [CAR.name, 'F1 2026赛季规格', `所属系统: ${categoryZh}`];

          const id = `part-${idx++}`;

          // Check for manual override
          const override = CAR.explosionOverrides[zhName];
          const explodedPos = override
            ? center.clone().add(new THREE.Vector3(...override))
            : new THREE.Vector3(
                this.cintureOffCenter.x + original.x * mag.x,
                this.cintureOffCenter.y + original.y * mag.y,
                this.cintureOffCenter.z + original.z * mag.z
              );

          const entry = {
            id,
            meshName: zhName,
            category: group.category,
            zh: zhName,
            func: func,
            specs: specs,
            pivot,
            center: center.clone(),
            assembledPos: center.clone(),
            explodedPos,
            currentFactor: 0,
            targetFactor: 0,
          };

          this.pivotGroup.add(pivot);
          this.parts.push(entry);
        });

        // Hide original meshes (clones are in pivot groups). Avoids second traverse.
        for (const m of meshes) m.mesh.visible = false;

        // Still add original to scene for any non-mesh objects (lights, etc.)
        this.scene.add(model);

        // Sort parts: center parts first, then by distance from center
        this.parts.sort((a, b) => {
          const da = a.center.distanceToSquared(this.cintureOffCenter);
          const db = b.center.distanceToSquared(this.cintureOffCenter);
          return da - db;
        });

        console.log(`Extracted ${this.parts.length} part groups`);

        // ── 诊断输出：每个Object_# mesh及其父组和坐标 ──
        console.log('=== MESH DIAGNOSTICS ===');
        console.log(`CINTURE_OFF Origin: (${this.cintureOffCenter.x.toFixed(4)}, ${this.cintureOffCenter.y.toFixed(4)}, ${this.cintureOffCenter.z.toFixed(4)})`);
        console.log('');
        console.log('MeshName           | ParentGroup          | center.x, center.y, center.z');
        console.log('-------------------|----------------------|------------------------------');
        // Show ALL individual meshes (before grouping)
        meshes.sort((a, b) => a.parentGroup.localeCompare(b.parentGroup) || a.name.localeCompare(b.name));
        meshes.forEach(m => {
          const cx = m.worldPos.x.toFixed(4), cy = m.worldPos.y.toFixed(4), cz = m.worldPos.z.toFixed(4);
          console.log(`${m.name.padEnd(19)} | ${m.parentGroup.padEnd(21)} | ${cx}, ${cy}, ${cz}`);
        });
        console.log('=== END DIAGNOSTICS ===');
        console.log(`Total meshes: ${meshes.length}, Grouped parts: ${this.parts.length}`);

        return this.parts;
      }

      getCategoryParts() {
        const map = {};
        this.parts.forEach(p => {
          if (!map[p.category]) map[p.category] = [];
          map[p.category].push(p);
        });
        return map;
      }
    }

    // ===== ExplosionController =====
    class ExplosionController {
      constructor(parts) {
        this.parts = parts;
        this.globalFactor = 0;
        this.categoryOverrides = {};
        this.introPlaying = false;
        this.introTimer = 0;
        this.introDuration = 1.5;
      }

      startIntro() {
        this.introPlaying = true;
        this.introTimer = 0;
        this.globalFactor = 0.35;
        this._applyFactors();
      }

      setGlobalFactor(factor) {
        this.globalFactor = factor;
        this._applyFactors();
      }

      toggleCategory(categoryId) {
        if (this.categoryOverrides[categoryId]) {
          delete this.categoryOverrides[categoryId];
        } else {
          this.categoryOverrides[categoryId] = true;
        }
        this._applyFactors();
        return !!this.categoryOverrides[categoryId];
      }

      isCategoryActive(categoryId) {
        return !!this.categoryOverrides[categoryId];
      }

      assembleAll() {
        this.categoryOverrides = {};
        this.globalFactor = 0;
        this._applyFactors();
      }

      _applyFactors() {
        const hasOverride = Object.keys(this.categoryOverrides).length > 0;
        this.parts.forEach(p => {
          if (hasOverride) {
            p.targetFactor = this.categoryOverrides[p.category] ? this.globalFactor : 0;
          } else {
            p.targetFactor = this.globalFactor;
          }
        });
      }

      update(delta) {
        if (this.introPlaying) {
          this.introTimer += delta;
          if (this.introTimer >= this.introDuration) {
            this.introPlaying = false;
            this.globalFactor = 0;
            this._applyFactors();
          }
        }

        const lerpSpeed = 1 - Math.exp(-8 * delta);

        this.parts.forEach(p => {
          p.currentFactor += (p.targetFactor - p.currentFactor) * lerpSpeed;
          p.pivot.position.lerpVectors(p.assembledPos, p.explodedPos, p.currentFactor);
        });
      }

      getDisplayFactor() {
        if (this.parts.length === 0) return 0;
        let max = 0;
        for (const p of this.parts) {
          if (p.currentFactor > max) max = p.currentFactor;
        }
        return max;
      }
    }

    // ===== InteractionManager =====
    class InteractionManager {
      constructor(camera, domElement, parts) {
        this.camera = camera;
        this.domElement = domElement;
        this.parts = parts;
        this.raycaster = new THREE.Raycaster();
        this.mouse = new THREE.Vector2();
        this.hoveredPart = null;
        this.selectedPart = null;
        this.allMeshes = [];
        this.meshToPartMap = new Map();
        this.onHover = null;
        this.onSelect = null;
        this._lastHoverCheck = 0;
        this._hoverThrottle = 50;
        this._collectMeshes();
        this._bindEvents();
      }

      _collectMeshes() {
        this.allMeshes = [];
        this.meshToPartMap.clear();
        this.parts.forEach(part => {
          part.pivot.traverse(child => {
            if (child.isMesh) {
              this.allMeshes.push(child);
              this.meshToPartMap.set(child, part);
            }
          });
        });
      }

      _bindEvents() {
        this.domElement.addEventListener('mousemove', (e) => this._onMouseMove(e), { passive: true });
        this.domElement.addEventListener('click', (e) => this._onClick(e));
        this.domElement.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            this._touchStartTime = Date.now();
            this._touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
          }
        }, { passive: true });
        this.domElement.addEventListener('touchend', (e) => {
          const dt = Date.now() - (this._touchStartTime || 0);
          const dx = Math.abs((e.changedTouches[0]?.clientX || 0) - (this._touchStartPos?.x || 0));
          const dy = Math.abs((e.changedTouches[0]?.clientY || 0) - (this._touchStartPos?.y || 0));
          if (dt < 300 && dx < 10 && dy < 10) {
            this._handleClick(e.changedTouches[0]);
          }
        });
      }

      _updateMouse(pos) {
        const rect = this.domElement.getBoundingClientRect();
        this.mouse.x = ((pos.clientX - rect.left) / rect.width) * 2 - 1;
        this.mouse.y = -((pos.clientY - rect.top) / rect.height) * 2 + 1;
      }

      _getIntersection() {
        this.raycaster.setFromCamera(this.mouse, this.camera);
        const intersects = this.raycaster.intersectObjects(this.allMeshes, false);
        if (intersects.length > 0) {
          return this.meshToPartMap.get(intersects[0].object) || null;
        }
        return null;
      }

      _onMouseMove(event) {
        const now = performance.now();
        if (now - this._lastHoverCheck < this._hoverThrottle) return;
        this._lastHoverCheck = now;
        this._updateMouse(event);
        const part = this._getIntersection();
        if (part !== this.hoveredPart) {
          this._resetHighlight(this.hoveredPart);
          this.hoveredPart = part;
          this._setHoverHighlight(part);
          if (this.onHover) this.onHover(part);
          this.domElement.style.cursor = part ? 'pointer' : 'grab';
        }
      }

      _onClick(event) {
        this._updateMouse(event);
        this._handleClick(event);
      }

      _handleClick(pos) {
        this._updateMouse(pos);
        const part = this._getIntersection();
        if (part) {
          this._selectPart(part);
        } else {
          this._deselectPart();
        }
      }

      _selectPart(part) {
        if (this.selectedPart && this.selectedPart !== part) {
          this._resetSelectHighlight(this.selectedPart);
        }
        this.selectedPart = part;
        this._setSelectHighlight(part);
        if (this.onSelect) this.onSelect(part);
      }

      _deselectPart() {
        if (this.selectedPart) {
          this._resetSelectHighlight(this.selectedPart);
          this.selectedPart = null;
          if (this.onSelect) this.onSelect(null);
        }
      }

      _modifyEmissive(part, color, intensity) {
        if (!part) return;
        part.pivot.traverse(child => {
          if (child.isMesh && child.material) {
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach(mat => {
              if (mat.emissive) {
                mat.emissive = new THREE.Color(color);
                mat.emissiveIntensity = intensity;
              }
            });
          }
        });
      }

      _setHoverHighlight(part) {
        if (part && part !== this.selectedPart) {
          this._modifyEmissive(part, '#444444', 0.4);
        }
      }

      _resetHighlight(part) {
        if (part && part !== this.selectedPart) {
          this._modifyEmissive(part, '#000000', 0);
        }
      }

      _createOutlineMeshes(part) {
        // Create a white edge-glow outline using the inverted-hull technique:
        // render the back-faces slightly scaled up so only the "rim" shows.
        const outlines = [];
        part.pivot.traverse(child => {
          if (child.isMesh && child.material) {
            const outline = child.clone();
            outline.material = new THREE.MeshBasicMaterial({
              color: 0xffffff,
              side: THREE.BackSide,
              transparent: true,
              opacity: 0.7,
              depthWrite: false,
            });
            outline.scale.set(1.04, 1.04, 1.04);
            outlines.push(outline);
          }
        });
        return outlines;
      }

      _setSelectHighlight(part) {
        // White edge glow via inverted-hull outline meshes
        if (!part._outlines) {
          part._outlines = this._createOutlineMeshes(part);
          part._outlines.forEach(o => part.pivot.add(o));
        }
      }

      _resetSelectHighlight(part) {
        if (part._outlines) {
          part._outlines.forEach(o => {
            if (o.parent) o.parent.remove(o);
          });
          part._outlines = null;
        }
      }

      deselect() {
        this._deselectPart();
        if (this.hoveredPart) {
          this._resetHighlight(this.hoveredPart);
          this.hoveredPart = null;
        }
      }
    }

    // ===== Toast =====
    class Toast {
      constructor(el) {
        this.el = el;
        this.timer = null;
      }
      show(msg, duration = 2000) {
        if (this.timer) clearTimeout(this.timer);
        this.el.textContent = msg;
        this.el.classList.add('show');
        this.timer = setTimeout(() => {
          this.el.classList.remove('show');
          this.timer = null;
        }, duration);
      }
    }

    // ===== App =====
    class App {
      constructor() {
        this.sceneManager = null;
        this.extractor = null;
        this.explosionController = null;
        this.interactionManager = null;
        this.toast = null;
        this.selectedPartId = null;
        this.isDark = true;
        this.parts = [];

        this.canvasContainer = document.getElementById('canvas-container');
        this.sidebar = document.getElementById('sidebar');
        this.infoPanel = document.getElementById('info-panel');
        this.slider = document.getElementById('explosion-slider');
        this.sliderValue = document.getElementById('slider-value');
        this.toastEl = document.getElementById('toast');
        this.loadingOverlay = document.getElementById('loading-overlay');
        this.progressFill = document.getElementById('progress-fill');
        this.loadingText = document.getElementById('loading-text');
        this.loadingSub = document.getElementById('loading-sub');

        // Pre-bind to avoid per-frame GC from arrow closure in rAF
        this._boundAnimate = this.animate.bind(this);
      }

      async init() {
        this.toast = new Toast(this.toastEl);

        // Init 3D scene
        this.sceneManager = new SceneManager(this.canvasContainer);
        this.sceneManager.init();

        // Bind events
        this.bindEvents();
        this.clock = new THREE.Clock();
        this.animate();

        // Load car
        await this.loadCar();
      }

      async loadCar() {
        // Reset state
        this.selectedPartId = null;
        this.infoPanel.classList.remove('has-selection', 'sheet-open');
        this.infoPanel.classList.add('hidden');
        this.slider.value = 0;
        this.sliderValue.textContent = '0%';

        // Show loading
        this.loadingOverlay.classList.remove('hidden');
        this.progressFill.style.width = '0%';
        this.progressFill.style.background = '';
        this._lastDownloadPct = 0;
        this.loadingText.textContent = `加载 ${CAR.name}...`;
        this.loadingSub.style.display = '';
        this.loadingSub.textContent = '模型文件约 4MB，首次加载请耐心等待';

        // Clean up old parts
        if (this.extractor) {
          this.sceneManager.scene.remove(this.extractor.pivotGroup);
        }
        this.parts = [];
        this.explosionController = null;
        this.interactionManager = null;

        // Load and extract model
        this.extractor = new ModelPartExtractor(this.sceneManager.scene);

        try {
          this.parts = await this.extractor.loadAndExtract(CAR.modelPath, (pct, phase, info) => {
            // Compute percent once — only the indeterminate download branch uses a different value
            let percent = Math.round(pct * 100);
            if (phase === 'download') {
              const loadedMB = (info.loaded / 1048576).toFixed(1);
              if (pct >= 0 && info.total > 0) {
                const totalMB = (info.total / 1048576).toFixed(1);
                this.loadingText.textContent = `下载模型中... ${percent}%`;
                this.loadingSub.textContent = `${loadedMB} MB / ${totalMB} MB`;
              } else {
                // No Content-Length — estimate from loaded bytes vs expected model size
                const estimated = Math.min(Math.round((info.loaded / CAR.modelSizeEstimate) * 100), 90);
                percent = Math.max(estimated, this._lastDownloadPct);
                this._lastDownloadPct = percent;
                this.loadingText.textContent = `下载模型中...`;
                this.loadingSub.textContent = `已下载 ${loadedMB} MB`;
              }
            } else if (phase === 'parse') {
              this.loadingText.textContent = '解析模型结构...';
              this.loadingSub.textContent = '正在解析 glTF 节点与网格数据';
            } else if (phase === 'build') {
              this.loadingText.textContent = '构建部件系统...';
              this.loadingSub.textContent = '正在分组部件并计算爆炸方向';
            }
            this.progressFill.style.width = percent + '%';
          });
        } catch (err) {
          console.error('Failed to load model:', err);
          this._showLoadingEnd(
            `<div style="text-align:center;color:#e74c3c;"><div style="font-size:1.2rem;margin-bottom:0.5rem;">❌ 模型加载失败</div><div style="font-size:0.7rem;margin-bottom:0.5rem;word-break:break-all;">${err.message || err}</div><div style="font-size:0.65rem;margin-top:0.5rem;color:#999;">${CAR.modelPath}</div></div>`,
            '请刷新页面重试，或检查网络连接', '#e74c3c', true);
          return;
        }

        if (this.parts.length === 0) {
          this._showLoadingEnd('⚠️ 未能提取到任何模型部件',
            '模型中没有找到命名网格，请检查模型文件', '#f39c12');
          return;
        }

        setTimeout(() => {
          this.loadingOverlay.classList.add('hidden');
          this.loadingSub.style.display = 'none';
        }, 400);

        // Update camera
        const cp = CAR.cameraPos;
        const ct = CAR.cameraTarget;
        this.sceneManager.camera.position.set(...cp);
        this.sceneManager.controls.target.set(...ct);
        this.sceneManager.defaultCameraPos = new THREE.Vector3(...cp);
        this.sceneManager.defaultTarget = new THREE.Vector3(...ct);
        this.sceneManager.controls.update();

        // Init controllers
        this.explosionController = new ExplosionController(this.parts);
        this.interactionManager = new InteractionManager(
          this.sceneManager.camera, this.sceneManager.renderer.domElement, this.parts
        );
        this.interactionManager.onSelect = (part) => {
          if (part) this.selectPart(part.id); else this.deselectPart();
        };

        // Rebuild sidebar
        this.buildCategoryButtons();

        // Intro
        setTimeout(() => {
          this.explosionController.startIntro();
          this.slider.value = 35;
          this.sliderValue.textContent = '35%';
          this.toast.show(`🏎️ ${CAR.name} · 点击部件查看详情`, 5000);
        }, 600);

        this.toast.show(`✅ 已加载 ${CAR.name}`, 3000);
      }

      _showLoadingEnd(title, sub, color, isHtml = false) {
        if (isHtml) this.loadingText.innerHTML = title;
        else this.loadingText.textContent = title;
        this.loadingSub.textContent = sub;
        this.progressFill.style.width = '100%';
        this.progressFill.style.background = color;
      }

      buildCategoryButtons() {
        // Get category part counts
        const catMap = this.extractor.getCategoryParts();

        this.sidebar.innerHTML = '<div class="section-title">系统分类</div>';
        CATEGORIES.forEach(cat => {
          const count = (catMap[cat.id] || []).length;
          if (count === 0) return; // Skip empty categories

          const btn = document.createElement('button');
          btn.className = 'cat-btn';
          btn.dataset.category = cat.id;
          btn.style.setProperty('--cat-color', cat.color);
          btn.innerHTML = `
            <span class="dot" style="background:${cat.color}"></span>
            <span>${cat.labelZh}</span>
            <span class="part-count">${count}</span>
          `;
          btn.addEventListener('click', () => this.toggleCategory(cat.id, btn));
          this.sidebar.appendChild(btn);
        });
      }

      toggleCategory(categoryId, btn) {
        if (!this.explosionController) return;
        const isActive = this.explosionController.toggleCategory(categoryId);
        if (isActive) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
        const cat = CATEGORIES.find(c => c.id === categoryId);
        this.toast.show(`${isActive ? '💥 爆炸:' : '🔧 组装:'} ${cat ? cat.labelZh : categoryId}`);
      }

      bindEvents() {
        window.addEventListener('resize', () => this.sceneManager.resize());

        document.getElementById('btn-theme').addEventListener('click', () => this.toggleTheme());
        document.getElementById('btn-reset').addEventListener('click', () => {
          this.sceneManager.resetCamera(true);
          this.toast.show('🔄 视角已重置');
        });
        document.getElementById('btn-help').addEventListener('click', () => {
          this.toast.show('🖱 拖拽=旋转 | 滚轮=缩放 | 右键=平移 | R=重置 | 0-8=快捷键 | Esc=取消选中', 5000);
        });
        document.getElementById('btn-close-info').addEventListener('click', () => {
          this.deselectPart();
        });

        this.slider.addEventListener('input', () => {
          const val = parseInt(this.slider.value);
          this.sliderValue.textContent = val + '%';
          this.explosionController.setGlobalFactor(val / 100);
        });

        window.addEventListener('keydown', (e) => {
          if (e.target.tagName === 'INPUT') return;
          switch (e.key.toLowerCase()) {
            case 'r':
              this.sceneManager.resetCamera(true);
              this.toast.show('🔄 视角已重置');
              break;
            case 'escape':
              this.deselectPart();
              break;
            case '0':
              this.slider.value = 0;
              this.sliderValue.textContent = '0%';
              this.explosionController.assembleAll();
              this.sidebar.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
              this.toast.show('🔧 全部组装');
              break;
            default:
              const cat = CATEGORIES.find(c => c.shortcut === e.key);
              if (cat) {
                const btn = this.sidebar.querySelector(`[data-category="${cat.id}"]`);
                if (btn) this.toggleCategory(cat.id, btn);
              }
              break;
          }
        });

        // Mobile swipe
        let touchStartY = 0;
        this.infoPanel.addEventListener('touchstart', (e) => {
          touchStartY = e.touches[0].clientY;
        }, { passive: true });
        this.infoPanel.addEventListener('touchmove', (e) => {
          if (e.touches[0].clientY - touchStartY > 50) {
            this.deselectPart();
          }
        }, { passive: true });
      }

      toggleTheme() {
        this.isDark = !this.isDark;
        document.documentElement.setAttribute('data-theme', this.isDark ? '' : 'light');
        this.sceneManager.updateTheme(this.isDark);
        localStorage.setItem('f1-state', JSON.stringify({ theme: this.isDark ? 'dark' : 'light' }));
      }

      selectPart(partId) {
        if (this.selectedPartId === partId) return;
        this.selectedPartId = partId;
        const part = this.parts.find(p => p.id === partId);
        if (!part) return;

        const catInfo = CATEGORIES.find(c => c.id === part.category);
        document.getElementById('info-category').textContent = catInfo ? catInfo.labelZh : part.category;
        const catColor = catInfo ? catInfo.color : '#999';
        document.getElementById('info-category').style.setProperty('--cat-color', catColor);
        document.getElementById('info-category').style.background = catColor;
        document.getElementById('info-name').textContent = part.zh || part.meshName;
        document.getElementById('info-function').textContent = part.func || '';
        const specsList = document.getElementById('info-specs');
        specsList.innerHTML = (part.specs || []).map(s => `<li>${s}</li>`).join('');

        this.infoPanel.classList.add('has-selection');
        this.infoPanel.classList.remove('hidden');

        // Show upgrade history for this part
        renderUpgradeList(part.zh || part.meshName);
        // Collapse the <details> when switching parts
        document.getElementById('upgrade-section').open = false;

        if (window.innerWidth <= 860) {
          this.infoPanel.classList.add('sheet-open');
        }

        this.toast.show(`已选择: ${part.zh || part.meshName}`);
      }

      deselectPart() {
        if (this.interactionManager) this.interactionManager.deselect();
        this.selectedPartId = null;
        this.infoPanel.classList.remove('has-selection');
        this.infoPanel.classList.add('hidden');
        if (window.innerWidth <= 860) {
          this.infoPanel.classList.remove('sheet-open');
        }
      }

      animate() {
        requestAnimationFrame(this._boundAnimate);
        const delta = Math.min(this.clock.getDelta(), 0.1);

        if (this.explosionController) {
          this.explosionController.update(delta);

          if (this.explosionController.introPlaying) {
            const displayVal = Math.round(this.explosionController.getDisplayFactor() * 100);
            this.slider.value = displayVal;
            this.sliderValue.textContent = displayVal + '%';
            this._introWasPlaying = true;
          } else if (this._introWasPlaying) {
            this.slider.value = 0;
            this.sliderValue.textContent = '0%';
            this._introWasPlaying = false;
          }
        }

        this.sceneManager.updateCameraAnim(delta);
        this.sceneManager.controls.update();
        this.sceneManager.renderer.render(this.sceneManager.scene, this.sceneManager.camera);
      }
    }

    // ===== Bootstrap =====
    const app = new App();
    app.init();

    console.log(`🏎️  F1 Exploded View - ${CAR.name}`);
    console.log('   glTF Model Loader ✓');
    console.log('   Part Extraction ✓');
    console.log('   Explosion Controller ✓');
    console.log('   Interaction Manager ✓');
  </script>
</body>
